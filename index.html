function teamRank(t){
  const valid = STATE.teachers.filter(x=>x.avg!=null && x.count>=2).sort((a,b)=>b.avg-a.avg);
  const idx = valid.findIndex(x=>x.name===t.name);
  if(idx<0) return `— / ${valid.length}（筆數不足）`;
  return `#${idx+1} / ${valid.length}`;
}

function renderStrengths(A, t){
  if(t.count < 2) return `<div class="empty">此老師僅 ${t.count} 筆 Demo，樣本不足以歸納共同優點。</div>`;
  const candidates = A.strengths.filter(x=>x.own>=0.1 || x.rate>=0.7).slice(0,3);
  if(!candidates.length) return `<div class="empty">此老師各維度表現平均，無明顯突出強項。</div>`;
  return candidates.map(x=>{
    const relMsg = x.own>=0.3 ? "明顯高於自身平均" : x.own>=0.1 ? "略高於自身平均" : "相對穩定";
    const teamMsg = x.team>=0.2 ? `，且比團隊平均高 ${x.team.toFixed(2)} 分` : x.team>=0 ? "，與團隊水準相當" : `，惟仍低於團隊 ${Math.abs(x.team).toFixed(2)} 分`;
    const rateStr = (x.rate*100).toFixed(0);
    return `<div class="stat-item pos">
      <div class="label">
        <span class="dim-tag">${x.d.key}</span>
        <span class="dim-name">${x.d.label}</span>
        <span class="metric">均分 <b>${x.val.toFixed(2)}</b> · 高分率 <b>${rateStr}%</b></span>
      </div>
      <div class="desc">${relMsg}${teamMsg}。${A.dimRates[x.d.key].count} 筆中 <b>${Math.round(x.rate*A.dimRates[x.d.key].count)}</b> 筆得 4 分以上。</div>
    </div>`;
  }).join("");
}

function renderWeaknesses(A, t){
  if(t.count < 2) return `<div class="empty">此老師僅 ${t.count} 筆 Demo，樣本不足以歸納共同缺點。</div>`;
  const candidates = A.weaknesses.filter(x=>x.own<=-0.1 || A.dimRates[x.d.key].low>=0.2).slice(0,3);
  if(!candidates.length) return `<div class="empty">此老師各維度表現均衡，無明顯共同缺點。</div>`;
  return candidates.map(x=>{
    const relMsg = x.own<=-0.3 ? "明顯低於自身平均" : x.own<=-0.1 ? "略低於自身平均" : "相對持平";
    const teamMsg = x.team<=-0.2 ? `，且比團隊平均低 ${Math.abs(x.team).toFixed(2)} 分` : x.team<=0 ? "，與團隊水準相當" : `，雖然仍高於團隊 ${x.team.toFixed(2)} 分`;
    const lowRate = A.dimRates[x.d.key].low;
    const lowMsg = lowRate>=0.2 ? ` · 有 <b>${(lowRate*100).toFixed(0)}%</b> 的 Demo 拿到 2 分以下` : "";
    return `<div class="stat-item neg">
      <div class="label">
        <span class="dim-tag">${x.d.key}</span>
        <span class="dim-name">${x.d.label}</span>
        <span class="metric">均分 <b>${x.val.toFixed(2)}</b> · 高分率 <b>${(x.rate*100).toFixed(0)}%</b></span>
      </div>
      <div class="desc">${relMsg}${teamMsg}${lowMsg}。</div>
    </div>`;
  }).join("");
}

function renderFeatures(A, t){
  if(t.count < 2) return `<div class="empty">此老師僅 ${t.count} 筆 Demo，樣本不足以歸納特色。</div>`;
  const parts = [];

  if(A.mostAbove && A.mostAbove.delta >= 0.2){
    parts.push(`<div class="stat-item">
      <div class="label"><span class="dim-tag" style="border-color:var(--good);color:var(--good)">標誌強項</span><span class="dim-name">${A.mostAbove.d.label}</span><span class="metric">+${A.mostAbove.delta.toFixed(2)} vs 團隊</span></div>
      <div class="desc">此老師最突出的維度，比團隊平均高 ${A.mostAbove.delta.toFixed(2)} 分</div>
    </div>`);
  }
  if(A.mostBelow && A.mostBelow.delta <= -0.2){
    parts.push(`<div class="stat-item">
      <div class="label"><span class="dim-tag" style="border-color:var(--bad);color:var(--bad)">明顯短板</span><span class="dim-name">${A.mostBelow.d.label}</span><span class="metric">${A.mostBelow.delta.toFixed(2)} vs 團隊</span></div>
      <div class="desc">此老師最明顯的短板，比團隊平均低 ${Math.abs(A.mostBelow.delta).toFixed(2)} 分</div>
    </div>`);
  }
  const stdLabel = A.totalStd < 0.4 ? "極穩定" : A.totalStd < 0.7 ? "穩定" : A.totalStd < 1.0 ? "中等波動" : "高度波動";
  const stdColor = A.totalStd < 0.4 ? "var(--good)" : A.totalStd < 0.7 ? "var(--accent)" : "var(--bad)";
  parts.push(`<div class="stat-item">
    <div class="label"><span class="dim-tag" style="border-color:${stdColor};color:${stdColor}">表現穩定度</span><span class="dim-name">${stdLabel}</span><span class="metric">平均 σ = <b>${A.totalStd.toFixed(2)}</b></span></div>
    <div class="desc">${A.totalStd < 0.4 ? "每次 Demo 表現一致，品質可預期" : A.totalStd < 0.7 ? "表現大致一致，偶有起伏" : A.totalStd < 1.0 ? "表現起伏明顯，需留意學員匹配" : "表現極不穩定，不同場合落差大"}</div>
  </div>`);

  if(A.mostAbove && A.mostBelow){
    const gap = A.mostAbove.val - A.mostBelow.val;
    if(gap >= 1.5){
      parts.push(`<div class="stat-item">
        <div class="label"><span class="dim-tag" style="border-color:var(--purple);color:var(--purple)">偏科型</span><span class="dim-name">${A.mostAbove.d.label} ↔ ${A.mostBelow.d.label}</span><span class="metric">落差 ${gap.toFixed(2)}</span></div>
        <div class="desc">強弱項差距大，在${A.mostAbove.d.label}突出但${A.mostBelow.d.label}需加強</div>
      </div>`);
    } else if(gap < 0.5){
      parts.push(`<div class="stat-item">
        <div class="label"><span class="dim-tag" style="border-color:var(--info);color:var(--info)">全面均衡</span><span class="dim-name">五維度差距小</span><span class="metric">落差 ${gap.toFixed(2)}</span></div>
        <div class="desc">五個維度表現平均，無明顯偏科</div>
      </div>`);
    }
  }
  return parts.length? parts.join("") : `<div class="empty">此老師表現與團隊接近，無突出特色。</div>`;
}

function renderTrendInsight(A){
  if(A.avgSeries.length < 3) return `<b>樣本數不足：</b>僅 ${A.avgSeries.length} 筆 Demo，無法判斷趨勢。`;
  const s = A.trendSlope;
  const firstHalf = A.avgSeries.slice(0, Math.floor(A.avgSeries.length/2));
  const secondHalf = A.avgSeries.slice(Math.ceil(A.avgSeries.length/2));
  const delta = mean(secondHalf) - mean(firstHalf);
  let trendLabel, trendClass;
  if(s >= 0.05){ trendLabel="明顯進步"; trendClass="trend-up"; }
  else if(s >= 0.01){ trendLabel="緩步進步"; trendClass="trend-up"; }
  else if(s <= -0.05){ trendLabel="明顯退步"; trendClass="trend-down"; }
  else if(s <= -0.01){ trendLabel="緩步退步"; trendClass="trend-down"; }
  else { trendLabel="表現穩定"; trendClass="trend-flat"; }
  const recent3 = A.avgSeries.slice(-3);
  const recentAvg = mean(recent3);
  const overallAvg = mean(A.avgSeries);
  const recentDelta = recentAvg - overallAvg;
  const dimSlopeEntries = DIMS.map(d=>({d, s:A.dimSlopes[d.key]})).sort((a,b)=>b.s-a.s);
  const bestImprove = dimSlopeEntries[0];
  const worstDecline = dimSlopeEntries[dimSlopeEntries.length-1];
  let dimTrend = "";
  if(bestImprove.s >= 0.05) dimTrend += `<br>📈 <b>${bestImprove.d.label}</b> 進步最明顯（斜率 +${bestImprove.s.toFixed(3)}）。`;
  if(worstDecline.s <= -0.05) dimTrend += `<br>📉 <b>${worstDecline.d.label}</b> 退步最明顯（斜率 ${worstDecline.s.toFixed(3)}）。`;
  return `
    <b>整體趨勢：</b><span class="${trendClass}">${trendLabel}</span>（斜率 ${s>=0?'+':''}${s.toFixed(3)}，後半均分 ${delta>=0?'+':''}${delta.toFixed(2)} vs 前半）
    <br><b>近 3 筆平均：</b>${recentAvg.toFixed(2)}（${recentDelta>=0?'+':''}${recentDelta.toFixed(2)} vs 整體平均 ${overallAvg.toFixed(2)}）
    ${dimTrend}
  `;
}

// 教務反饋摘要 + 事前/事後對比分析
function renderAdminFeedbackSummary(t, A){
  const sorted = A.sorted;
  const adminEvents = [];
  sorted.forEach((r, i)=>{
    if(r.adminNote && r.adminNote.trim()){
      adminEvents.push({idx:i, row:r});
    }
  });

  if(!adminEvents.length){
    return `<div style="margin-top:14px;font-size:11px;color:var(--text-faint);font-family:'JetBrains Mono',monospace">此老師尚無教務反饋紀錄。</div>`;
  }

  // 計算事件前後平均（每個事件）
  const eventAnalysis = adminEvents.map(e=>{
    const before = sorted.slice(Math.max(0,e.idx-3), e.idx).map(r=>r.avg).filter(x=>x!=null);
    const after = sorted.slice(e.idx+1, e.idx+4).map(r=>r.avg).filter(x=>x!=null);
    return {
      ...e,
      beforeAvg: before.length? mean(before): null,
      afterAvg: after.length? mean(after): null,
      beforeN: before.length,
      afterN: after.length
    };
  });

  return `
    <div style="margin-top:16px;padding:12px 14px;background:rgba(76,201,240,.05);border:1px solid rgba(76,201,240,.3);border-left:3px solid var(--info)">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--info);margin-bottom:10px;font-weight:700">
        📢 教務反饋事件 · ${adminEvents.length} 筆
      </div>
      ${eventAnalysis.map(e=>{
        let deltaLabel = "";
        if(e.beforeAvg!=null && e.afterAvg!=null){
          const delta = e.afterAvg - e.beforeAvg;
          const color = delta>=0.3?"var(--good)":delta<=-0.3?"var(--bad)":"var(--text-dim)";
          const symbol = delta>=0.3?"↗":delta<=-0.3?"↘":"→";
          deltaLabel = `<span style="color:${color};font-weight:700;margin-left:8px">${symbol} 後 ${delta>=0?'+':''}${delta.toFixed(2)}</span>`;
        }
        const beforeStr = e.beforeAvg!=null? `前 ${e.beforeAvg.toFixed(2)} (n=${e.beforeN})`:`前 — `;
        const afterStr = e.afterAvg!=null? `後 ${e.afterAvg.toFixed(2)} (n=${e.afterN})`:`後 — `;
        return `<div style="padding:8px 0;border-bottom:1px dashed var(--line)">
          <div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:4px">
            <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text)">${e.row.date}</span>
            <span style="font-size:11px;color:var(--text-dim)">學員 ${escapeHtml(e.row.student||"—")} · 均分 <b style="color:${scoreColor(e.row.avg)}">${e.row.avg?e.row.avg.toFixed(1):'—'}</b></span>
            <span style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);margin-left:auto">${beforeStr} · ${afterStr}${deltaLabel}</span>
          </div>
          <div style="font-size:12px;color:var(--text);line-height:1.55;padding-left:4px">
            ${escapeHtml(e.row.adminNote)}
          </div>
        </div>`;
      }).join("")}
      ${adminEvents.length>=2? renderOverallAdminImpact(eventAnalysis):""}
    </div>
  `;
}

function renderOverallAdminImpact(eventAnalysis){
  const allBefore = [], allAfter = [];
  eventAnalysis.forEach(e=>{
    if(e.beforeAvg!=null) allBefore.push(e.beforeAvg);
    if(e.afterAvg!=null) allAfter.push(e.afterAvg);
  });
  if(!allBefore.length || !allAfter.length) return "";
  const avgBefore = mean(allBefore);
  const avgAfter = mean(allAfter);
  const delta = avgAfter - avgBefore;
  const color = delta>=0.2?"var(--good)":delta<=-0.2?"var(--bad)":"var(--text-dim)";
  const label = delta>=0.2?"整體有正面回應":delta<=-0.2?"整體未見改善":"整體反應中性";
  return `<div style="margin-top:10px;padding:8px 10px;background:var(--bg-2);font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--text-dim)">
    💡 綜合反饋前後：前均分 <b style="color:var(--text)">${avgBefore.toFixed(2)}</b> → 後均分 <b style="color:var(--text)">${avgAfter.toFixed(2)}</b>
    <span style="color:${color};font-weight:700"> · ${label} (${delta>=0?'+':''}${delta.toFixed(2)})</span>
  </div>`;
}

function renderDimDistribution(A){
  return DIMS.map(d=>{
    const dist = A.dimDist[d.key];
    const total = dist.reduce((a,b)=>a+b,0);
    if(!total) return `<div class="empty" style="margin-bottom:12px">${d.label}：無資料</div>`;
    return `<div style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px">${d.label} (${d.key}) · n=${total}</div>
      <div class="dist-wrap">
        ${[5,4,3,2,1].map(sc=>{
          const n = dist[sc-1];
          const pct = total? (n/total*100):0;
          return `<div class="dist-row s${sc}">
            <div class="dist-label">${sc} 分</div>
            <div class="dist-bar" style="--p:${pct}%"></div>
            <div class="dist-val">${n} · ${pct.toFixed(0)}%</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");
}

function renderSlopes(A){
  const entries = DIMS.map(d=>({d, s:A.dimSlopes[d.key]}));
  const maxAbs = Math.max(...entries.map(x=>Math.abs(x.s)), 0.001);
  return `<div class="dim-grid" style="margin-top:8px">
    ${entries.map(x=>{
      const absPct = (Math.abs(x.s)/maxAbs*50);
      const isPos = x.s >= 0;
      const color = x.s >= 0.05 ? "var(--good)" : x.s <= -0.05 ? "var(--bad)" : "var(--text-dim)";
      const label = x.s >= 0.05 ? "進步" : x.s <= -0.05 ? "退步" : "持平";
      return `<div class="dim-row" style="grid-template-columns:72px 1fr 90px">
        <div class="dname">${x.d.label}<br><span style="color:var(--text-faint)">${x.d.key}</span></div>
        <div style="position:relative;height:14px;background:var(--bg-2);border:1px solid var(--line)">
          <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)"></div>
          <div style="position:absolute;top:0;bottom:0;${isPos?`left:50%;width:${absPct}%`:`right:50%;width:${absPct}%`};background:${color}"></div>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;color:${color}">
          <b>${x.s>=0?'+':''}${x.s.toFixed(3)}</b><br><span style="color:var(--text-faint);font-size:10px">${label}</span>
        </div>
      </div>`;
    }).join("")}
  </div>
  <div class="legend-mini">
    <span>斜率 ＞ +0.05 視為進步 · ＜ -0.05 視為退步</span>
  </div>`;
}

// ---------- 年齡段掌握度 ----------
function renderAgeBreakdown(t){
  // 先算年齡有效率
  const withAge = t.rows.filter(r=>r.age!=null);
  const noAge = t.rows.filter(r=>r.age==null);
  const ageCoverage = (withAge.length / t.rows.length * 100);

  // 團隊整體每年齡段的均分（作為對照）
  const teamByGroup = {};
  STATE.rows.forEach(r=>{
    if(!teamByGroup[r.ageGroup]) teamByGroup[r.ageGroup]={rows:[],dims:{ENG:[],PRO:[],PAC:[],INT:[],RAP:[]}};
    teamByGroup[r.ageGroup].rows.push(r);
    DIMS.forEach(d=>{ if(r[d.key]!=null) teamByGroup[r.ageGroup].dims[d.key].push(r[d.key]); });
  });
  const teamGroupAvg = {};
  Object.keys(teamByGroup).forEach(g=>{
    const avgs = teamByGroup[g].rows.map(r=>r.avg).filter(x=>x!=null);
    const dimAvg = {};
    DIMS.forEach(d=>{ dimAvg[d.key] = teamByGroup[g].dims[d.key].length? mean(teamByGroup[g].dims[d.key]):null; });
    teamGroupAvg[g] = {avg:avgs.length?mean(avgs):null, dimAvg, count:teamByGroup[g].rows.length};
  });

  // 該老師按年齡段聚合
  const byGroup = {};
  t.rows.forEach(r=>{
    if(!byGroup[r.ageGroup]) byGroup[r.ageGroup] = {rows:[], dims:{ENG:[],PRO:[],PAC:[],INT:[],RAP:[]}, ages:[]};
    byGroup[r.ageGroup].rows.push(r);
    if(r.age!=null) byGroup[r.ageGroup].ages.push(r.age);
    DIMS.forEach(d=>{ if(r[d.key]!=null) byGroup[r.ageGroup].dims[d.key].push(r[d.key]); });
  });

  // 期望順序：幼齡、小學、高年級+、未知
  const ORDER = ["幼齡 (3-5)","小學 (6-9)","高年級+ (10+)","未知"];
  const groups = ORDER.filter(g=>byGroup[g]).map(g=>{
    const avgs = byGroup[g].rows.map(r=>r.avg).filter(x=>x!=null);
    const dimAvg = {};
    DIMS.forEach(d=>{ dimAvg[d.key] = byGroup[g].dims[d.key].length? mean(byGroup[g].dims[d.key]):null; });
    return {
      group: g,
      count: byGroup[g].rows.length,
      ages: byGroup[g].ages,
      avg: avgs.length? mean(avgs):null,
      dimAvg,
      teamAvg: teamGroupAvg[g]? teamGroupAvg[g].avg : null
    };
  });

  if(!groups.length) return `<div class="empty">此老師無年齡資料可分析</div>`;

  // 找最強/最弱年齡段
  const valid = groups.filter(g=>g.avg!=null && g.group!=="未知");
  const best = valid.length? [...valid].sort((a,b)=>b.avg-a.avg)[0] : null;
  const worst = valid.length>1? [...valid].sort((a,b)=>a.avg-b.avg)[0] : null;

  let insight = "";
  if(best && worst && best.group !== worst.group){
    const gap = best.avg - worst.avg;
    if(gap >= 0.8){
      insight = `<div class="insight-box" style="margin-bottom:16px">
        <b>年齡掌握度差距明顯：</b>最擅長 <b style="color:var(--good)">${best.group}</b>（均分 ${best.avg.toFixed(2)}），
        最不擅長 <b style="color:var(--bad)">${worst.group}</b>（均分 ${worst.avg.toFixed(2)}），落差 <b>${gap.toFixed(2)}</b> 分。
        ${noAge.length? `<br>⚠ 有 ${noAge.length} 筆資料無年齡標記（總筆數 ${t.rows.length}，覆蓋率 ${ageCoverage.toFixed(0)}%）`:""}
      </div>`;
    } else if(gap < 0.3){
      insight = `<div class="insight-box" style="margin-bottom:16px">
        <b>年齡適應力均衡：</b>各年齡段均分落差僅 ${gap.toFixed(2)}，無明顯偏好。
      </div>`;
    }
  }
  if(!insight && noAge.length){
    insight = `<div class="insight-box" style="margin-bottom:16px">
      ⚠ 有 ${noAge.length} 筆資料無年齡標記（總筆數 ${t.rows.length}，覆蓋率 ${ageCoverage.toFixed(0)}%）
    </div>`;
  }

  // 計算 bar 圖數據
  const maxCount = Math.max(...groups.map(g=>g.count));

  return insight + `
    <div class="age-grid">
      ${groups.map(g=>{
        const avgStr = g.avg? g.avg.toFixed(2): '—';
        const teamStr = g.teamAvg? g.teamAvg.toFixed(2): '—';
        const delta = (g.avg!=null && g.teamAvg!=null)? g.avg - g.teamAvg : null;
        const deltaStr = delta==null? '' : (delta>=0?'+':'') + delta.toFixed(2);
        const deltaColor = delta==null?'var(--text-faint)':delta>=0.2?'var(--good)':delta<=-0.2?'var(--bad)':'var(--text-dim)';
        const ageRange = g.ages.length? `${Math.min(...g.ages)}~${Math.max(...g.ages)}歲`:'—';
        return `<div class="age-card">
          <div class="age-head">
            <div class="age-group">${g.group}</div>
            <div class="age-count">${g.count} 筆</div>
          </div>
          <div class="age-avg" style="color:${scoreColor(g.avg)}">${avgStr}</div>
          <div class="age-team">團隊同齡段 ${teamStr} <span style="color:${deltaColor};font-weight:700">${deltaStr}</span></div>
          <div class="age-range">${ageRange}</div>
          <div class="age-dims">
            ${DIMS.map(d=>{
              const v = g.dimAvg[d.key];
              const pct = v? (v/5*100).toFixed(0):0;
              return `<div class="age-dim-row" title="${d.label}">
                <span class="adn">${d.key}</span>
                <div class="adb"><div class="adf" style="width:${pct}%;background:${d.color}"></div></div>
                <span class="adv">${v?v.toFixed(1):'—'}</span>
              </div>`;
            }).join("")}
          </div>
        </div>`;
      }).join("")}
    </div>
  `;
}

function drawTeacherTrend(t, A, filter){
  filter = filter || "all";
  const sorted = A.sorted;
  const labels = sorted.map(r=>`${r.date.slice(5)}·${(r.student||'').slice(0,6)}`);
  const avgs = sorted.map(r=>r.avg);
  const ma = avgs.map((_,i)=>{
    const w = avgs.slice(Math.max(0,i-2),i+1).filter(x=>x!=null);
    return w.length? mean(w): null;
  });

  // 找出所有有教務反饋的 Demo index
  const adminFeedbackIndexes = [];
  sorted.forEach((r, i)=>{
    if(r.adminNote && r.adminNote.trim()){
      adminFeedbackIndexes.push({idx:i, note:r.adminNote, date:r.date, student:r.student, avg:r.avg});
    }
  });

  let datasets = [];
  if(filter === "all"){
    datasets = [
      ...DIMS.map(d=>({label:d.label,data:sorted.map(r=>r[d.key]),borderColor:d.color,backgroundColor:"transparent",borderWidth:1.2,pointRadius:2,tension:.25})),
      {label:"均分",data:avgs,borderColor:"#e8ecf1",backgroundColor:"transparent",borderWidth:1.8,pointRadius:3,tension:.2},
      {label:"均分·3點移動平均",data:ma,borderColor:"#ffd166",backgroundColor:"rgba(255,209,102,.08)",borderWidth:2.5,pointRadius:0,tension:.3,fill:true,borderDash:[6,3]}
    ];
  } else if(filter === "avg"){
    datasets = [
      {label:"均分",data:avgs,borderColor:"#e8ecf1",backgroundColor:"rgba(232,236,241,.08)",borderWidth:2.5,pointRadius:4,tension:.2,fill:true},
      {label:"均分·3點移動平均",data:ma,borderColor:"#ffd166",backgroundColor:"transparent",borderWidth:2.5,pointRadius:0,tension:.3,borderDash:[6,3]}
    ];
  } else {
    const d = DIMS.find(x=>x.key===filter);
    if(d){
      const vals = sorted.map(r=>r[d.key]);
      const dimMA = vals.map((_,i)=>{
        const w = vals.slice(Math.max(0,i-2),i+1).filter(x=>x!=null);
        return w.length? mean(w):null;
      });
      const validVals = vals.filter(x=>x!=null);
      const s = A.dimSlopes[d.key];
      const mv = mean(validVals);
      const trendLine = vals.map((_,i)=>mv + s*(i - (vals.length-1)/2));
      datasets = [
        {label:d.label,data:vals,borderColor:d.color,backgroundColor:d.color+"22",borderWidth:2.5,pointRadius:5,pointBackgroundColor:d.color,tension:.2,fill:true},
        {label:"3點移動平均",data:dimMA,borderColor:"#ffd166",backgroundColor:"transparent",borderWidth:2,borderDash:[6,3],pointRadius:0,tension:.3},
        {label:"回歸趨勢線",data:trendLine,borderColor:"#e8ecf1",backgroundColor:"transparent",borderWidth:1,borderDash:[2,4],pointRadius:0}
      ];
    }
  }

  // 為 legend 加一個「教務反饋」標示（假的 dataset，只為了讓圖例說明這條線的意義）
  if(adminFeedbackIndexes.length){
    datasets.push({
      label:`📢 教務反饋 (${adminFeedbackIndexes.length})`,
      data: [], // 沒有實際資料點
      borderColor:"#4cc9f0", backgroundColor:"transparent",
      borderWidth:0, pointRadius:0,
      // 讓 legend 顯示虛線樣式
      borderDash:[4,4]
    });
  }

  // 建立 annotations：每個有教務反饋的 index 畫一條垂直虛線
  const annotations = {};
  adminFeedbackIndexes.forEach((a, i)=>{
    annotations[`admin_${i}`] = {
      type:"line",
      xMin: a.idx, xMax: a.idx,
      yMin: 0, yMax: 5,
      borderColor:"rgba(76,201,240,.5)",
      borderWidth: 1.5,
      borderDash:[4,4],
      label:{
        display: true,
        content: "📢",
        position: "start",
        backgroundColor: "rgba(76,201,240,.15)",
        color: "#4cc9f0",
        font: {size:12, weight:"bold"},
        padding: 3,
        borderRadius: 2
      }
    };
  });

  const c = new Chart(document.getElementById("trendT"),{
    type:"line",
    data:{labels,datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{labels:{color:"#e8ecf1",font:{size:11},boxWidth:14}},
        annotation: { annotations },
        tooltip:{
          callbacks:{
            afterBody: (items) => {
              if(!items.length) return "";
              const idx = items[0].dataIndex;
              const row = sorted[idx];
              if(row && row.adminNote){
                // 斷行處理，每行不超過 30 字
                const note = row.adminNote.match(/.{1,28}/g).join("\n");
                return `\n📢 教務反饋：\n${note}`;
              }
              return "";
            }
          }
        }
      },
      scales:{
        x:{grid:{color:"#262d36"},ticks:{color:"#9aa4b2",maxRotation:60,minRotation:45,font:{size:9}}},
        y:{min:0,max:5,grid:{color:"#262d36"},ticks:{color:"#9aa4b2",stepSize:1}}
      }
    }
  });
  STATE.charts.push(c);
}

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}

  const src = STATE.dataSource;
  const srcLabel = src==="live" ? "🟢 Live (Google Sheets)" : src==="fallback" ? "🟡 Fallback (內建 15 筆)" : "— 未知";
  const rawLen = STATE.lastFetchRaw ? STATE.lastFetchRaw.length : 0;
  const arrLen = STATE.lastArray ? STATE.lastArray.length : 0;
  const anaOk = STATE.lastAnalysis ? STATE.lastAnalysis.filter(a=>a.status==="ok").length : 0;
  const anaSk = STATE.lastAnalysis ? STATE.lastAnalysis.filter(a=>a.status==="skip").length : 0;

  }

  // 2D 陣列前 10 列

    html += `<h4>2D 陣列前 10 列</h4><div class="debug-tbl-wrap"><table><thead><tr><th>#</th>`;

    for(let i=0;i<maxCols;i++) html += `<th>col ${i}</th>`;
    html += `</tr></thead><tbody>`;

      html += `<tr><td class="num">${i}</td>`;

      }
      html += `</tr>`;

      html += `<tr><td class="num">${a.arrayIdx}</td><td>${badge}</td><td>${escapeHtml(info)}</td><td>${escapeHtml(a.firstCol)}</td></tr>`;
    });
    html += `</tbody></table></div>`;
  }

    downloadFile("gviz_raw.json", JSON.stringify(STATE.lastFetchJson || {raw: STATE.lastFetchRaw}, null, 2), "application/json");

  });
  const copyRpt = document.getElementById("copyReport");
  if(copyRpt) copyRpt.addEventListener("click",async()=>{
    try{ await navigator.clipboard.writeText(buildReport()); copyRpt.textContent = "✓ 已複製"; setTimeout(()=>copyRpt.textContent="📋 複製報告到剪貼簿",2000); }
    catch(e){ alert("複製失敗：" + e.message); }
  });
}

function buildReport(){
  const L = [];
  L.push(`ETalking Demo 老師評比 — Debug Report`);
  L.push(`產出時間: ${new Date().toISOString()}`);
  L.push(`資料源: ${STATE.dataSource}`);
  L.push(`URL: ${GVIZ_URL}`);
  L.push(`=`.repeat(80));

  L.push(`\n【基本統計】`);
  L.push(`  gviz 原始字元數: ${STATE.lastFetchRaw ? STATE.lastFetchRaw.length : "(無,可能是 fallback)"}`);
  L.push(`  2D 陣列列數: ${STATE.lastArray ? STATE.lastArray.length : 0}`);
  L.push(`  有效資料筆數: ${STATE.rows.length}`);
  L.push(`  老師人數: ${STATE.teachers.length}`);

  if(STATE.lastFetchJson && STATE.lastFetchJson.table){
    const t = STATE.lastFetchJson.table;
    L.push(`\n【gviz table 結構】`);
    L.push(`  cols 長度: ${t.cols?t.cols.length:"(無)"}`);
    if(t.cols) t.cols.forEach((c,i)=>L.push(`    [${i}] id=${c.id||''} type=${c.type||''} label="${c.label||''}"`));
    L.push(`  rows 長度: ${t.rows?t.rows.length:"(無)"}`);
  }

  if(STATE.lastArray){
    L.push(`\n【2D 陣列前 15 列】`);
    STATE.lastArray.slice(0,15).forEach((r,i)=>{
      L.push(`  [${i}] ${r.map(x=>`"${String(x).slice(0,40)}"`).join(" | ")}`);
    });
  }

  if(STATE.lastAnalysis){
    L.push(`\n【逐列解析】`);
    const ok = STATE.lastAnalysis.filter(a=>a.status==="ok").length;
    const sk = STATE.lastAnalysis.filter(a=>a.status==="skip").length;
    L.push(`  成功: ${ok}, 跳過: ${sk}`);
    const reasons = {};
    STATE.lastAnalysis.filter(a=>a.status==="skip").forEach(a=>{ reasons[a.reason]=(reasons[a.reason]||0)+1 });
    Object.entries(reasons).forEach(([r,n])=>L.push(`    - ${r}: ${n} 次`));
    L.push(`\n  逐列明細:`);
    STATE.lastAnalysis.forEach(a=>{
      const info = a.status==="ok" ? `OK   | 老師=${a.data.teacher}` : `SKIP | ${a.reason}`;
      L.push(`    [${String(a.arrayIdx).padStart(3)}] ${info} | 首欄="${a.firstCol}"`);
    });
  }

  L.push(`\n【老師聚合 (${STATE.teachers.length} 位)】`);
  L.push(`  ${"老師名稱".padEnd(22)} | 筆數 | 均分 | ENG  | PRO  | PAC  | INT  | RAP`);
  L.push(`  ${"-".repeat(78)}`);
  STATE.teachers.forEach(t=>{
    const f = v => v==null?"  — ":v.toFixed(2);
    L.push(`  ${(t.name||"").padEnd(22).slice(0,22)} | ${String(t.count).padStart(4)} | ${f(t.avg)} | ${f(t.dimAvg.ENG)} | ${f(t.dimAvg.PRO)} | ${f(t.dimAvg.PAC)} | ${f(t.dimAvg.INT)} | ${f(t.dimAvg.RAP)}`);
  });

  L.push(`\n【前 3 筆完整資料】`);
  STATE.rows.slice(0,3).forEach((r,i)=>{
    L.push(`\n  [筆 ${i+1}]`);
    Object.entries(r).forEach(([k,v])=>L.push(`    ${k.padEnd(16)}: ${v===""?"(空)":v}`));
  });

  L.push(`\n${"=".repeat(80)}\n報告結束`);
  return L.join("\n");
}

function downloadFile(filename, content, type){
  const blob = new Blob([content], {type: type||"text/plain;charset=utf-8"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
}

document.getElementById("reloadBtn").addEventListener("click",()=>fetchData(STATE.dataSource==="fallback"));
document.getElementById("srcLive").addEventListener("click",()=>fetchData(false));
document.getElementById("srcFallback").addEventListener("click",()=>fetchData(true));

// 角色切換
document.querySelectorAll("#roleSwitcher button").forEach(b=>{
  b.addEventListener("click",()=>{
    STATE.currentRole = b.dataset.role;
    render();
    window.scrollTo({top:0, behavior:"smooth"});
  });
});

fetchData(false);
</script>
