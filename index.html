<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"/>
<title>ETalking Demo 老師評比分析</title>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Noto+Serif+TC:wght@400;600;900&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-annotation@3.0.1/dist/chartjs-plugin-annotation.min.js"></script>
<style>
:root{
  --bg:#0b0d10; --bg-2:#13171c; --panel:#171b21; --panel-2:#1e242c;
  --line:#262d36; --line-2:#323b47;
  --text:#e8ecf1; --text-dim:#9aa4b2; --text-faint:#5b6472;
  --accent:#ffd166; --accent-2:#ef476f;
  --good:#06d6a0; --warn:#ffb545; --bad:#ef476f; --info:#4cc9f0; --purple:#b388eb;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Helvetica Neue",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 10% -10%, rgba(255,209,102,.05), transparent 60%),radial-gradient(900px 500px at 110% 10%, rgba(239,71,111,.04), transparent 60%),var(--bg);min-height:100vh}
.wrap{max-width:1480px;margin:0 auto;padding:28px 32px 80px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}
h1{font-family:"Noto Serif TC",serif;font-weight:900;font-size:34px;line-height:1.1;margin:0;letter-spacing:-.5px}
h1 small{display:block;font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-faint);font-weight:400;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.meta .chip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:6px 10px;border:1px solid var(--line-2);border-radius:2px;color:var(--text-dim);background:var(--panel)}
.meta .chip b{color:var(--accent);font-weight:500}
.reload-btn{appearance:none;border:1px solid var(--line-2);background:var(--panel);color:var(--text);padding:8px 14px;font-family:"JetBrains Mono",monospace;font-size:11px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:.15s}
.reload-btn:hover{background:var(--accent);color:#000;border-color:var(--accent)}
.reload-btn:disabled{opacity:.5;cursor:wait}
.kpi{display:grid;grid-template-columns:repeat(6,1fr);gap:1px;background:var(--line);border:1px solid var(--line);margin-bottom:24px}
.kpi .cell{background:var(--panel);padding:16px 18px}
.kpi .k{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.kpi .v{font-family:"Noto Serif TC",serif;font-weight:700;font-size:26px;line-height:1}
.kpi .v small{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-dim);font-weight:400;margin-left:4px}
.layout{display:grid !important;grid-template-columns:300px 1fr;gap:20px}
@media(max-width:768px){
  .layout{grid-template-columns:1fr}
  .tlist{position:static !important;max-height:none !important;margin-bottom:20px}
  .tlist ul{max-height:300px;overflow-y:auto}
  .tlist .view-tabs,.tlist h2,.tlist .sort-btns{position:static !important}
}
.role-view .layout{display:grid !important}  /* 確保在 role-view 內也套用 grid */
.role-view:not(.active) .layout{display:none !important}
.tlist{background:var(--panel);border:1px solid var(--line);max-height:82vh;overflow-y:auto;position:sticky;top:20px;width:100%;min-width:0}
.tlist .view-tabs{display:flex;background:var(--bg-2);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}
.tlist .view-tabs button{flex:1;appearance:none;background:none;border:none;border-right:1px solid var(--line);color:var(--text-faint);padding:10px 4px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:.1s}
.tlist .view-tabs button:last-child{border-right:none}
.tlist .view-tabs button:hover{background:var(--panel-2);color:var(--text)}
.tlist .view-tabs button.active{color:var(--accent);background:var(--panel);font-weight:700;box-shadow:inset 0 -2px 0 var(--accent)}
.tlist h2{font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);padding:14px 16px;margin:0;border-bottom:1px solid var(--line);background:var(--bg-2);position:sticky;top:38px;z-index:2}
.tlist .sort-btns{display:flex;border-bottom:1px solid var(--line);background:var(--bg-2);position:sticky;top:75px;z-index:2}
.tlist .sort-btns button{flex:1;appearance:none;background:none;border:none;border-right:1px solid var(--line);color:var(--text-faint);padding:8px 4px;font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.tlist .sort-btns button:last-child{border-right:none}
.tlist .sort-btns button.active{color:var(--accent);background:var(--panel)}
.tlist ul{list-style:none;margin:0;padding:0}
.tlist li{border-bottom:1px solid var(--line)}
.tlist li button{width:100%;appearance:none;background:none;border:none;color:inherit;text-align:left;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;transition:.1s;font-family:inherit}
.tlist li button:hover{background:var(--panel-2)}
.tlist li.active button{background:var(--panel-2);box-shadow:inset 3px 0 0 var(--accent)}
.tlist .tname{flex:1;min-width:0;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.tlist .tmeta{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint)}
.tlist .tscore{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;min-width:32px;text-align:right}
.tlist .tbar{display:block;height:2px;margin-top:3px;background:var(--line-2);position:relative;overflow:hidden}
.tlist .tbar::after{content:"";position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:var(--p,0%)}
.tlist .all{background:var(--bg-2)}
.tlist .all button{padding:14px 16px}
.tlist .all.active button{box-shadow:inset 3px 0 0 var(--accent-2)}
.main{min-width:0;width:100%;overflow:hidden}
.detail-head{margin-bottom:20px}
.detail-head .crumb{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-faint);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:8px}
.detail-head h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:32px;margin:0;line-height:1}
.detail-head .sub{margin-top:8px;color:var(--text-dim);font-size:13px;display:flex;gap:16px;flex-wrap:wrap}
.detail-head .sub span{font-family:"JetBrains Mono",monospace;font-size:11px}
.detail-head .sub span b{color:var(--text);font-weight:500}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
@media(max-width:900px){.g2,.g3{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);padding:20px}
.card h3{font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--text-faint);margin:0 0 14px;font-weight:700;display:flex;align-items:center;gap:10px}
.card h3::before{content:"";display:block;width:6px;height:6px;background:var(--accent);border-radius:50%}
.card.bad h3::before{background:var(--bad)}
.card.good h3::before{background:var(--good)}
.card.info h3::before{background:var(--info)}
.card.purple h3::before{background:var(--purple)}
.card.warn-sec h3::before{background:var(--warn)}
.card h3 .sub{margin-left:auto;font-size:9px;color:var(--text-faint);letter-spacing:.5px;text-transform:none;font-weight:400}
.chart-box{position:relative;height:320px;width:100%}
.chart-box.tall{height:380px;width:100%}
.stat-item{padding:10px 0;border-bottom:1px dashed var(--line)}
.stat-item:last-child{border-bottom:none}
.stat-item .label{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap}
.stat-item .dim-tag{font-family:"JetBrains Mono",monospace;font-size:10px;padding:2px 8px;border:1px solid var(--line-2);color:var(--text-dim);letter-spacing:1px}
.stat-item .dim-name{font-weight:600;color:var(--text);font-size:14px}
.stat-item .metric{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-faint);margin-left:auto}
.stat-item .metric b{color:var(--accent);font-weight:500}
.stat-item.pos .dim-name{color:var(--good)}
.stat-item.neg .dim-name{color:var(--bad)}
.stat-item.pos .metric b{color:var(--good)}
.stat-item.neg .metric b{color:var(--bad)}
.stat-item .desc{font-size:12px;color:var(--text-dim);line-height:1.6}
.stat-item .desc b{color:var(--text);font-weight:500}
.empty{color:var(--text-faint);font-size:12px;font-style:italic;padding:8px 0}
.dist-wrap{margin-top:6px}
.dist-row{display:grid;grid-template-columns:40px 1fr 60px;gap:6px;align-items:center;margin-bottom:3px;font-family:"JetBrains Mono",monospace;font-size:10px}
.dist-row .dist-bar{height:12px;background:var(--bg-2);position:relative;border:1px solid var(--line)}
.dist-row .dist-bar::after{content:"";position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:var(--p,0%)}
.dist-row.s1 .dist-bar::after{background:var(--bad)}
.dist-row.s2 .dist-bar::after{background:#f07167}
.dist-row.s3 .dist-bar::after{background:var(--warn)}
.dist-row.s4 .dist-bar::after{background:var(--accent)}
.dist-row.s5 .dist-bar::after{background:var(--good)}
.dist-row .dist-label{color:var(--text-dim)}
.dist-row .dist-val{color:var(--text);text-align:right}
.fb-list{max-height:440px;overflow-y:auto}
.fb-item{padding:12px 14px;border-left:2px solid var(--line-2);margin-bottom:10px;background:var(--bg-2)}
.fb-item .fb-meta{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);margin-bottom:4px;display:flex;gap:10px;flex-wrap:wrap;letter-spacing:.5px}
.fb-item .fb-meta b{color:var(--text-dim)}
.fb-item .fb-text{color:var(--text);font-size:13px;line-height:1.6}
.fb-item.neg{border-left-color:var(--bad)}
.fb-item.pos{border-left-color:var(--good)}
.fb-list::-webkit-scrollbar,.tlist::-webkit-scrollbar{width:6px}
.fb-list::-webkit-scrollbar-thumb,.tlist::-webkit-scrollbar-thumb{background:var(--line-2)}
.fb-list::-webkit-scrollbar-track,.tlist::-webkit-scrollbar-track{background:var(--bg-2)}
.dim-grid{display:grid;gap:12px}
.dim-row{display:grid;grid-template-columns:72px 1fr 56px;gap:12px;align-items:center}
.dim-row .dname{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-dim);letter-spacing:.5px;line-height:1.3}
.dim-row .dbar{height:10px;background:var(--bg-2);position:relative;border:1px solid var(--line)}
.dim-row .dbar::after{content:"";position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));width:var(--p,0%);transition:width .6s}
.dim-row .dbar .team-mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--info);left:var(--tp,0%)}
.dim-row .dval{font-family:"JetBrains Mono",monospace;font-size:13px;font-weight:700;text-align:right;line-height:1.2}
.dim-row .dval.low{color:var(--bad)}
.dim-row .dval.mid{color:var(--warn)}
.dim-row .dval.high{color:var(--good)}
.rank-row{transition:.15s;padding:4px 8px;margin:-4px -8px;border-radius:2px}
.rank-row:hover{background:var(--panel-2);transform:translateX(2px)}
.rank-row:hover .dname{color:var(--accent)}

/* Dimension filter buttons */
.dim-filter{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.df-btn{appearance:none;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text-dim);padding:6px 10px;font-family:"JetBrains Mono",monospace;font-size:10px;cursor:pointer;letter-spacing:.5px;transition:.15s;border-radius:2px}
.df-btn:hover{background:var(--panel-2);color:var(--text)}
.df-btn.active{background:var(--accent);color:#000;border-color:var(--accent);font-weight:700}

/* Age breakdown cards */
.age-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.age-card{background:var(--bg-2);border:1px solid var(--line);padding:14px}
.age-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.age-group{font-family:"Noto Sans TC";font-size:13px;font-weight:700;color:var(--text);letter-spacing:.5px}
.age-count{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--accent);background:var(--panel);padding:2px 8px;border:1px solid var(--line-2)}
.age-avg{font-family:"Noto Serif TC",serif;font-size:32px;font-weight:900;line-height:1;margin-bottom:4px}
.age-team{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);margin-bottom:6px;letter-spacing:.5px}
.age-range{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--info);margin-bottom:10px}
.age-dims{display:grid;gap:4px}
.age-dim-row{display:grid;grid-template-columns:32px 1fr 32px;gap:6px;align-items:center;font-family:"JetBrains Mono",monospace;font-size:10px}
.age-dim-row .adn{color:var(--text-faint);letter-spacing:.5px}
.age-dim-row .adb{height:6px;background:var(--panel);border:1px solid var(--line);position:relative}
.age-dim-row .adf{height:100%;transition:width .6s}
.age-dim-row .adv{text-align:right;color:var(--text);font-weight:700}

/* Heatmap */
.heatmap-wrap{overflow:auto;max-width:100%;border:1px solid var(--line);background:var(--bg-2)}
.heatmap{border-collapse:separate;border-spacing:0;font-family:"JetBrains Mono",monospace;font-size:10px;min-width:100%}
.heatmap th,.heatmap td{padding:0;border-right:1px solid var(--bg);border-bottom:1px solid var(--bg);position:relative}
.heatmap thead th{background:var(--panel);color:var(--accent);font-weight:700;padding:8px 6px;text-align:center;letter-spacing:.5px;text-transform:uppercase;font-size:10px;position:sticky;top:0;z-index:2;writing-mode:vertical-rl;transform:rotate(180deg);min-width:40px;height:100px;vertical-align:bottom}
.heatmap thead th.corner{writing-mode:horizontal-tb;transform:none;text-align:left;padding:8px 12px;height:auto}
.heatmap tbody th{background:var(--panel);color:var(--text);font-weight:700;padding:8px 12px;text-align:left;white-space:nowrap;position:sticky;left:0;z-index:1;min-width:120px;border-right:2px solid var(--line)}
.heatmap td{text-align:center;cursor:pointer;transition:.1s;min-width:50px;height:38px;padding:2px 4px;vertical-align:middle}
.heatmap td.empty{background:var(--bg);color:var(--text-faint);cursor:default}
.heatmap td.empty::after{content:"·";color:var(--line-2)}
.heatmap td:not(.empty):hover{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.heatmap td .cell-score{font-weight:700;font-size:12px;color:#000}
.heatmap td .cell-n{font-size:9px;color:rgba(0,0,0,.55);display:block;line-height:1}
.heatmap .legend-row{display:flex;gap:14px;align-items:center;padding:8px 12px;background:var(--bg-2);border-top:1px solid var(--line);font-size:10px;color:var(--text-faint);font-family:"JetBrains Mono",monospace;letter-spacing:.5px;flex-wrap:wrap}
.heatmap .legend-scale{display:inline-flex;align-items:center;gap:0;height:14px;border:1px solid var(--line)}
.heatmap .legend-scale span{width:22px;height:14px;display:inline-block}

/* Top combos */
.combo-list{display:grid;gap:8px;margin-top:14px}
.combo-row{display:grid;grid-template-columns:22px 1fr 1fr auto auto;gap:12px;align-items:center;padding:8px 12px;background:var(--bg-2);border:1px solid var(--line);cursor:pointer;transition:.1s}
.combo-row:hover{background:var(--panel-2);border-color:var(--accent)}
.combo-row .rank{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-faint);font-weight:700;text-align:center}
.combo-row .name{font-size:13px;color:var(--text)}
.combo-row .name.teacher{color:var(--accent);font-weight:500}
.combo-row .name.consultant{color:var(--info)}
.combo-row .combo-score{font-family:"JetBrains Mono",monospace;font-size:14px;font-weight:700}
.combo-row .combo-meta{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint)}

/* Recommender */
.recommender{background:linear-gradient(135deg, rgba(255,209,102,.05), rgba(76,201,240,.05));border:1px solid var(--line);padding:18px 20px;margin-bottom:20px}
.recommender h3{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;color:var(--accent);margin:0 0 4px;display:flex;align-items:center;gap:10px}
.recommender .rec-sub{font-size:12px;color:var(--text-dim);margin-bottom:14px}
.rec-form{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:14px}
.rec-field{display:flex;flex-direction:column;gap:6px}
.rec-field label{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase}
.rec-field select,.rec-field input[type="number"]{
  appearance:none;background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);
  padding:8px 10px;font-family:"JetBrains Mono",monospace;font-size:12px;
}
.rec-field select:focus,.rec-field input:focus{outline:none;border-color:var(--accent)}
.rec-field .rec-weight{display:flex;align-items:center;gap:8px}
.rec-field .rec-weight input[type="range"]{flex:1}
.rec-field .rec-weight .wv{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--accent);min-width:24px;text-align:right}
.rec-results{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px;margin-top:14px}
.rec-card{background:var(--panel);border:1px solid var(--line);padding:14px;cursor:pointer;transition:.15s;position:relative}
.rec-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.rec-card .rec-rank{position:absolute;top:-10px;left:12px;background:var(--accent);color:#000;padding:2px 10px;font-family:"JetBrains Mono",monospace;font-size:10px;font-weight:700;letter-spacing:1px}
.rec-card.gold .rec-rank{background:var(--accent)}
.rec-card.silver .rec-rank{background:#c0c0c0}
.rec-card.bronze .rec-rank{background:#cd7f32;color:#fff}
.rec-card .rec-name{font-family:"Noto Serif TC",serif;font-size:18px;font-weight:700;color:var(--text);margin:6px 0 4px}
.rec-card .rec-score-row{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.rec-card .rec-score{font-family:"Noto Serif TC",serif;font-size:28px;font-weight:900;line-height:1}
.rec-card .rec-label{font-family:"JetBrains Mono",monospace;font-size:9px;color:var(--text-faint);letter-spacing:1px}
.rec-card .rec-breakdown{display:grid;gap:4px;font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-dim)}
.rec-card .rec-breakdown-row{display:grid;grid-template-columns:70px 1fr auto;gap:6px;align-items:center}
.rec-card .rec-bar{height:4px;background:var(--bg-2);position:relative}
.rec-card .rec-bar::after{content:"";position:absolute;left:0;top:0;bottom:0;background:var(--good);width:var(--p,0%)}
.rec-card .rec-reason{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);font-size:11px;color:var(--text-dim);line-height:1.55}
.rec-card .rec-reason b{color:var(--accent);font-weight:500}
.rec-empty{padding:30px;text-align:center;color:var(--text-faint);font-size:13px}

/* Role switcher */
.role-switcher{display:flex;gap:0;border:1px solid var(--line-2);background:var(--panel);margin-bottom:24px;overflow:hidden}
.role-switcher button{flex:1;appearance:none;background:none;border:none;border-right:1px solid var(--line-2);color:var(--text-dim);padding:14px 20px;font-family:"Noto Sans TC",sans-serif;font-size:14px;cursor:pointer;letter-spacing:.5px;transition:.15s;display:flex;align-items:center;justify-content:center;gap:10px;font-weight:500}
.role-switcher button:last-child{border-right:none}
.role-switcher button:hover:not(.active){background:var(--panel-2);color:var(--text)}
.role-switcher button.active{background:var(--accent);color:#000;font-weight:700}
.role-switcher button .role-icon{font-size:18px}
.role-switcher button .role-sub{font-size:10px;font-family:"JetBrains Mono",monospace;color:var(--text-faint);letter-spacing:1px;text-transform:uppercase;margin-left:4px}
.role-switcher button.active .role-sub{color:rgba(0,0,0,.6)}

/* Role section containers */
.role-view{display:none}
.role-view.active{display:block}

/* Self-strictness widget (consultant) */

const DIMS = [

// ---------- HARDCODED FALLBACK DATA (15 筆) ----------

const FALLBACK_DATA = [

async function fetchData(forceFallback){
  document.getElementById("dataStatus").innerHTML = "載入中…";
  document.getElementById("reloadBtn").disabled = true;
  document.getElementById("errorBox").innerHTML = "";
  STATE.lastFetchRaw = null;
  STATE.lastFetchJson = null;
  STATE.lastArray = null;
  STATE.lastAnalysis = null;

  if(forceFallback){
    return loadFallback("手動切換至內建資料");
  }

  try{
    const resp = await fetch(GVIZ_URL + "&_=" + Date.now(), {cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP " + resp.status + " — 表單可能非公開狀態");
    const text = await resp.text();
    STATE.lastFetchRaw = text;
    const jsonMatch = text.match(/setResponse\((.*)\)/s);
    if(!jsonMatch) throw new Error("無法解析 gviz 回傳格式");
    const json = JSON.parse(jsonMatch[1]);
    STATE.lastFetchJson = json;
    if(json.status === "error"){
      const r = json.errors && json.errors[0] ? json.errors[0].detailed_message : "未知錯誤";
      throw new Error("Google 回傳錯誤：" + r);
    }
    processGvizTable(json.table);
    STATE.dataSource = "live";
    document.getElementById("dataStatus").innerHTML = `🟢 <b>LIVE</b> · ${STATE.rows.length} 筆 / ${STATE.teachers.length} 位老師 / ${new Date().toLocaleTimeString("zh-TW")}`;
    render();
    refreshDebugPanel();
  }catch(e){
    console.warn("[Live fetch failed, falling back]", e);
    loadFallback(`Live 抓取失敗：${e.message}`);
  }finally{
    document.getElementById("reloadBtn").disabled = false;
  }
}

function loadFallback(reason){
  try{
    STATE.lastArray = FALLBACK_DATA.slice();
    processRows(FALLBACK_DATA);
    STATE.dataSource = "fallback";
    document.getElementById("dataStatus").innerHTML = `🟡 <b>FALLBACK</b> · ${STATE.rows.length} 筆內建資料 / ${STATE.teachers.length} 位老師`;
    document.getElementById("errorBox").innerHTML = `<div class="warn-box">
      <b>⚠ 目前使用內建 Fallback 資料（${FALLBACK_DATA.length} 筆）</b><br>
      原因：${escapeHtml(reason)}<br>
      儀表板功能完全可用，但數字不是即時的。若要切回即時資料，請檢查：
      <ul style="margin:6px 0 0 16px">
        <li>Google 表單「共用設定」是否為「知道連結的任何人」皆可檢視</li>
        <li>是否以 <code>file://</code> 開啟（CORS 會擋）— 請部署到 GitHub Pages 或 <code>python -m http.server</code></li>
        <li>網路連線是否正常</li>
      </ul>
      <div style="margin-top:8px"><button class="reload-btn" onclick="fetchData(false)">重試 Live 抓取</button></div>
    </div>`;
    render();
    refreshDebugPanel();
  }catch(e){
    document.getElementById("errorBox").innerHTML = `<div class="error"><b>嚴重錯誤：</b>連 Fallback 資料都無法處理：${escapeHtml(e.message)}</div>`;
    document.getElementById("dataStatus").innerHTML = "載入完全失敗";
  }finally{
    document.getElementById("reloadBtn").disabled = false;
  }
}

// 將 gviz table 轉換為與原 processRows 相容的資料結構
function processGvizTable(table){
  if(!table || !table.rows) throw new Error("表單無資料");
  const data = [];
  table.rows.forEach(r=>{
    if(!r || !r.c) return;
    const row = r.c.map(cell=>{
      if(cell == null) return "";
      if(cell.f != null && cell.f !== "") return String(cell.f);
      if(cell.v == null) return "";
      const v = cell.v;
      if(typeof v === "string"){
        const dm = v.match(/^Date\((\d+),(\d+),(\d+)(?:,\d+,\d+,\d+)?\)$/);
        if(dm) return `${dm[1]}/${parseInt(dm[2])+1}/${parseInt(dm[3])}`;
      }
      return String(v);
    });
    data.push(row);
  });

  if(!data.length) throw new Error("表單資料為空");
  STATE.lastArray = data;
  processRows(data);
}

function processRows(data){
  // gviz 的 headers=0 會把前面的說明列和標題列都吞掉，只剩下資料列（偶爾前面還有 1-2 列空白）
  // 策略：從「第一個首欄是日期格式」的列開始讀，不再依賴「找到 DEMO日期 標題」
  const isDate = s => /^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(String(s||"").trim());
  const parseNum = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?null:n; };

  // 從學員欄解析年齡：抓最後一個括號 (內容) 能被解析成 0~20 的數字
  // 範例：
  //   "陳宥晞(Kids)(MGM)(4)" → 4
  //   "Zoey(Kids)(4.5)" → 4.5
  //   "陳洛昕Sia(Kids)(MGM)(3.3)" → 3.3
  //   "Kenton/柯崴騰(Kids)(MGM)(3歲半)" → 3.5
  //   "Anna(JR)(12)" → 12
  //   "Sylvia" → null（無標記）
  //   "Example" → null
  function parseAge(studentStr){
    if(!studentStr) return null;
    // 抓所有括號內容
    const matches = [...studentStr.matchAll(/[（(]([^（()）]+)[)）]/g)];
    if(!matches.length) return null;
    // 從右往左找第一個能解析成數字的
    for(let i=matches.length-1;i>=0;i--){
      let inner = matches[i][1].trim();
      // 排除已知的非年齡標記
      if(/^(Kids|JR|kids|jr|MGM|TRGT|mgm|trgt)$/i.test(inner)) continue;
      // "3歲半" → 3.5
      const halfMatch = inner.match(/^(\d+)\s*歲半$/);
      if(halfMatch) return parseFloat(halfMatch[1]) + 0.5;
      // "3歲" 或 "3 歲" → 3
      const ageMatch = inner.match(/^(\d+(?:\.\d+)?)\s*歲?$/);
      if(ageMatch){
        const n = parseFloat(ageMatch[1]);
        if(!isNaN(n) && n > 0 && n <= 20) return n;
      }
      // 純數字（支援 "4快5" 這種取第一個數字）
      const numMatch = inner.match(/^(\d+(?:\.\d+)?)/);
      if(numMatch){
        const n = parseFloat(numMatch[1]);
        if(!isNaN(n) && n > 0 && n <= 20) return n;
      }
    }
    return null;
  }

  // 年齡分組：3 段
  function ageGroup(age){
    if(age == null) return "未知";
    if(age < 6) return "幼齡 (3-5)";
    if(age < 10) return "小學 (6-9)";
    return "高年級+ (10+)";
  }

  const rows = [];
  const analysis = [];  // 逐列狀態記錄，供 debug 使用

  data.forEach((r, idx)=>{
    const entry = {
      arrayIdx: idx,
      firstCol: r && r[0]!=null ? String(r[0]).slice(0,30) : "(空列)",
      status: "", reason: "", data: null
    };
    if(!r || r.length === 0){ entry.status="skip"; entry.reason="整列為空"; analysis.push(entry); return; }
    const date = r[0] ? String(r[0]).trim() : "";
    const teacher = r[1] ? String(r[1]).trim() : "";
    if(!date){ entry.status="skip"; entry.reason="首欄為空"; analysis.push(entry); return; }
    if(!isDate(date)){ entry.status="skip"; entry.reason=`首欄不是日期格式 (${date.slice(0,20)})`; analysis.push(entry); return; }
    if(!teacher){ entry.status="skip"; entry.reason="老師欄為空"; analysis.push(entry); return; }

    const student = String(r[2]||"").trim();
    const age = parseAge(student);
    const row = {
      date, teacher, student,
      age, ageGroup: ageGroup(age),
      consultant: String(r[3]||"").trim(),
      ENG: parseNum(r[4]), PRO: parseNum(r[5]), PAC: parseNum(r[6]),
      INT: parseNum(r[7]), RAP: parseNum(r[8]),
      avg: parseNum(r[9]),
      room: String(r[10]||"").trim(),
      consultantNote: String(r[11]||"").trim(),
      adminNote: String(r[12]||"").trim(),
    };
    if([row.ENG,row.PRO,row.PAC,row.INT,row.RAP].every(x=>x===null)){
      entry.status="skip"; entry.reason="五項分數全空"; analysis.push(entry); return;
    }
    if(/^TEST\./i.test(row.teacher)){
      entry.status="skip"; entry.reason=`測試列 (${row.teacher})`; analysis.push(entry); return;
    }
    entry.status="ok"; entry.data=row;
    rows.push(row);
    analysis.push(entry);
  });
  STATE.lastAnalysis = analysis;

  const teamDimAvg = {}, teamDimStd = {};
  DIMS.forEach(d=>{
    const arr = rows.map(r=>r[d.key]).filter(x=>x!=null);
    teamDimAvg[d.key] = arr.length? mean(arr):0;
    teamDimStd[d.key] = arr.length? std(arr):0;
  });

  const map = {};
  rows.forEach(r=>{
    if(!map[r.teacher]) map[r.teacher] = {name:r.teacher, rows:[], dims:{ENG:[],PRO:[],PAC:[],INT:[],RAP:[]}};
    map[r.teacher].rows.push(r);
    DIMS.forEach(d=>{ if(r[d.key]!=null) map[r.teacher].dims[d.key].push(r[d.key]); });
  });
  const teachers = Object.values(map).map(t=>{
    const dimAvg = {}, dimStd = {};
    DIMS.forEach(d=>{
      dimAvg[d.key] = t.dims[d.key].length? mean(t.dims[d.key]) : null;
      dimStd[d.key] = t.dims[d.key].length>1? std(t.dims[d.key]) : 0;
    });
    const allAvgs = t.rows.map(r=>r.avg).filter(x=>x!=null);
    return {...t, dimAvg, dimStd, avg: allAvgs.length? mean(allAvgs): null, count: t.rows.length};
  });

  STATE.rows = rows;
  STATE.teachers = teachers;
  STATE.teamDimAvg = teamDimAvg;
  STATE.teamDimStd = teamDimStd;
}

function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function std(arr){ const m = mean(arr); return Math.sqrt(mean(arr.map(x=>(x-m)*(x-m)))); }
function slope(ys){
  const n = ys.length;
  if(n<2) return 0;
  const xs = ys.map((_,i)=>i);
  const mx = mean(xs), my = mean(ys);
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  return den===0? 0 : num/den;
}

function destroyCharts(){ STATE.charts.forEach(c=>{try{c.destroy()}catch(e){}}); STATE.charts=[]; }

function render(){
  destroyCharts();

  // 先清空所有 view 的內容，避免切換時殘留
  const consultantEl = document.getElementById("consultantContent");

    document.getElementById("view-consultant").classList.add("active");

    renderQAView();
  } else {
    document.getElementById("view-full").classList.add("active");
    renderTeacherList();
    renderMain();
  }

  // 在下一個 animation frame 強制 resize 所有 chart
  requestAnimationFrame(()=>{
    STATE.charts.forEach(c=>{ try{ c.resize(); }catch(e){} });
  });
}

function renderKPI(){
  const total = STATE.rows.length;
  const tcount = STATE.teachers.length;
  const overallAvg = mean(STATE.rows.map(r=>r.avg).filter(x=>x!=null));
  let best=["",-1], worst=["",99];
  DIMS.forEach(d=>{
    const v = STATE.teamDimAvg[d.key];
    if(v > best[1]) best=[d.label, v];
    if(v < worst[1]) worst=[d.label, v];
  });
  const highRate = (STATE.rows.filter(r=>r.avg!=null && r.avg>=4).length / total * 100);
  const lowRate = (STATE.rows.filter(r=>r.avg!=null && r.avg<3.5).length / total * 100);
  document.getElementById("kpi").innerHTML = `
    <div class="cell"><div class="k">總反饋筆數</div><div class="v">${total}</div></div>
    <div class="cell"><div class="k">老師人數</div><div class="v">${tcount}</div></div>
    <div class="cell"><div class="k">整體平均</div><div class="v">${overallAvg.toFixed(2)}<small>/ 5.0</small></div></div>
    <div class="cell"><div class="k">高分率 (≥4)</div><div class="v" style="color:var(--good)">${highRate.toFixed(0)}<small>%</small></div></div>
    <div class="cell"><div class="k">低分率 (<3.5)</div><div class="v" style="color:var(--bad)">${lowRate.toFixed(0)}<small>%</small></div></div>
    <div class="cell"><div class="k">團隊最弱項</div><div class="v" style="color:var(--bad);font-size:19px">${worst[0]}<small>${worst[1].toFixed(2)}</small></div></div>
  `;
}

// 按顧問聚合
function aggregateByConsultant(){
  const map = {};
  STATE.rows.forEach(r=>{
    if(!r.consultant) return;
    if(!map[r.consultant]) map[r.consultant] = {name:r.consultant, rows:[], teachers:new Set()};
    map[r.consultant].rows.push(r);
    map[r.consultant].teachers.add(r.teacher);
  });
  return Object.values(map).map(c=>{
    const avgs = c.rows.map(r=>r.avg).filter(x=>x!=null);
    return {
      name:c.name, rows:c.rows, count:c.rows.length,
      teacherCount: c.teachers.size,
      teachers: [...c.teachers],
      avg: avgs.length? mean(avgs): null
    };
  });
}

// 按日期聚合
function aggregateByDate(){
  const map = {};
  STATE.rows.forEach(r=>{
    if(!r.date) return;
    if(!map[r.date]) map[r.date] = {date:r.date, rows:[], teachers:new Set(), consultants:new Set()};
    map[r.date].rows.push(r);
    map[r.date].teachers.add(r.teacher);
    if(r.consultant) map[r.date].consultants.add(r.consultant);
  });
  const weekdayMap = ["日","一","二","三","四","五","六"];
  return Object.values(map).map(d=>{
    const avgs = d.rows.map(r=>r.avg).filter(x=>x!=null);
    let wd = "";
    try{
      const dt = new Date(d.date.replace(/\//g,"-"));
      if(!isNaN(dt)) wd = "週"+weekdayMap[dt.getDay()];
    }catch(e){}
    return {
      date:d.date, weekday:wd, rows:d.rows, count:d.rows.length,
      teacherCount:d.teachers.size, teachers:[...d.teachers],
      consultantCount:d.consultants.size,
      avg: avgs.length? mean(avgs):null
    };
  });
}

function scoreColor(v){ if(v==null) return "var(--text-faint)"; if(v>=4.3) return "var(--good)"; if(v>=3.5) return "var(--accent)"; if(v>=3.0) return "var(--warn)"; return "var(--bad)"; }

// ---------- TEACHER × CONSULTANT HEATMAP ----------
// 計算每個 (老師, 顧問) 組合的聚合資料
function buildCombinations(){
  const map = {};
  STATE.rows.forEach(r=>{
    if(!r.teacher || !r.consultant) return;
    const key = r.teacher + "||" + r.consultant;
    if(!map[key]) map[key] = {teacher:r.teacher, consultant:r.consultant, rows:[]};
    map[key].rows.push(r);
  });
  return Object.values(map).map(c=>{
    const avgs = c.rows.map(r=>r.avg).filter(x=>x!=null);
    return {
      teacher: c.teacher, consultant: c.consultant,
      count: c.rows.length, rows: c.rows,
      avg: avgs.length? mean(avgs): null
    };
  });
}

// 熱力圖顏色：根據分數返回背景色
function heatColor(score){
  if(score==null) return "#13171c";
  // 1=紅、2=橙、3=黃、4=黃綠、5=綠
  const s = Math.max(1, Math.min(5, score));
  const ratio = (s-1)/4;  // 0~1
  // 從 #ef476f (紅) 經 #ffd166 (黃) 到 #06d6a0 (綠)
  if(ratio < 0.5){
    // 紅→黃
    const t = ratio * 2;
    const r = Math.round(239 + (255-239)*t);
    const g = Math.round(71 + (209-71)*t);
    const b = Math.round(111 + (102-111)*t);
    return `rgb(${r},${g},${b})`;
  } else {
    // 黃→綠
    const t = (ratio - 0.5) * 2;
    const r = Math.round(255 + (6-255)*t);
    const g = Math.round(209 + (214-209)*t);
    const b = Math.round(102 + (160-102)*t);
    return `rgb(${r},${g},${b})`;
  }
}

function renderHeatmap(){
  const combos = buildCombinations();
  if(!combos.length) return `<div class="rec-empty">無資料</div>`;

  // 取所有有出現的老師與顧問（按出場次數排序）
  const teacherCounts = {}, consultantCounts = {};
  STATE.rows.forEach(r=>{
    if(r.teacher) teacherCounts[r.teacher] = (teacherCounts[r.teacher]||0)+1;
    if(r.consultant) consultantCounts[r.consultant] = (consultantCounts[r.consultant]||0)+1;
  });
  const teachers = Object.keys(teacherCounts).sort((a,b)=>teacherCounts[b]-teacherCounts[a]);
  const consultants = Object.keys(consultantCounts).sort((a,b)=>consultantCounts[b]-consultantCounts[a]);

  // 快速查表
  const comboMap = {};
  combos.forEach(c=>{ comboMap[c.teacher+"||"+c.consultant] = c; });

  let html = `<div class="heatmap-wrap"><table class="heatmap"><thead><tr>
    <th class="corner">顧問 ＼ 老師</th>
    ${teachers.map(t=>`<th title="${escapeAttr(t)} · 共 ${teacherCounts[t]} 場">${escapeHtml(t.slice(0,12))}</th>`).join("")}
  </tr></thead><tbody>`;

  consultants.forEach(cons=>{
    html += `<tr><th title="${escapeAttr(cons)} · 共 ${consultantCounts[cons]} 場">${escapeHtml(cons)}<br><span style="font-size:9px;color:var(--text-faint);font-weight:400">${consultantCounts[cons]} 場</span></th>`;
    teachers.forEach(t=>{
      const combo = comboMap[t+"||"+cons];
      if(!combo){
        html += `<td class="empty"></td>`;
      } else {
        const color = heatColor(combo.avg);
        const title = `${t} × ${cons}\\n${combo.count} 場 · 均分 ${combo.avg?combo.avg.toFixed(2):'—'}`;
        html += `<td class="hm-cell" data-pair="${escapeAttr(t+"||"+cons)}" style="background:${color}" title="${escapeAttr(title)}">
          <span class="cell-score">${combo.avg?combo.avg.toFixed(1):'—'}</span>
          <span class="cell-n">n=${combo.count}</span>
        </td>`;
      }
    });
    html += `</tr>`;
  });
  html += `</tbody></table>
    <div class="legend-row">
      <span>顏色 = 均分：</span>
      <span class="legend-scale">
        ${[1,1.5,2,2.5,3,3.5,4,4.5,5].map(s=>`<span style="background:${heatColor(s)}"></span>`).join("")}
      </span>
      <span>1.0</span><span style="margin-left:auto">5.0</span>
      <span>· 空白表示該組合從未合作過</span>
      <span>· 共 ${combos.length} 組已合作</span>
    </div>
  </div>`;
  return html;
}

function renderTopCombos(n, order){
  const combos = buildCombinations().filter(c=>c.count >= 2 && c.avg != null);
  if(!combos.length) return `<div class="empty">無樣本數 ≥ 2 的組合</div>`;
  combos.sort((a,b)=> order==="asc" ? a.avg-b.avg : b.avg-a.avg);
  const top = combos.slice(0, n);
  return `<div class="combo-list">
    ${top.map((c,i)=>`<div class="combo-row" data-pair="${escapeAttr(c.teacher+"||"+c.consultant)}">

// ---------- WORKLOAD ANALYSIS (老師當日多場次分析) ----------
function renderWorkloadAnalysis(){
  // 計算每位老師每天的場次數與表現
  const teacherDayMap = {};
  STATE.rows.forEach(r=>{
    if(r.avg==null) return;
    const key = r.teacher + "||" + r.date;
    if(!teacherDayMap[key]) teacherDayMap[key] = {teacher:r.teacher, date:r.date, avgs:[]};
    teacherDayMap[key].avgs.push(r.avg);
  });
  const dayEntries = Object.values(teacherDayMap).map(e=>({
    teacher: e.teacher, date: e.date,
    sessions: e.avgs.length, avg: mean(e.avgs)
  }));

  // 按單日場次分組統計
  const bySessionCount = {};
  dayEntries.forEach(e=>{
    if(!bySessionCount[e.sessions]) bySessionCount[e.sessions] = [];
    bySessionCount[e.sessions].push(e.avg);
  });

  const sessionLevels = Object.keys(bySessionCount).map(Number).sort((a,b)=>a-b);
  const levelStats = sessionLevels.map(n=>{
    const avgs = bySessionCount[n];
    return {
      sessions: n,
      dayCount: avgs.length,
      avg: mean(avgs),
      min: Math.min(...avgs),
      max: Math.max(...avgs)
    };
  });

  // 相關係數：場次數 vs 均分
  const allDays = dayEntries;
  const correlation = pearson(allDays.map(e=>e.sessions), allDays.map(e=>e.avg));

  // 找出「單日多場次」的老師排行
  const teacherSessionMap = {};
  dayEntries.forEach(e=>{
    if(!teacherSessionMap[e.teacher]) teacherSessionMap[e.teacher] = {teacher:e.teacher, days:[], total:0, maxInDay:0};
    teacherSessionMap[e.teacher].days.push(e);
    teacherSessionMap[e.teacher].total += e.sessions;
    teacherSessionMap[e.teacher].maxInDay = Math.max(teacherSessionMap[e.teacher].maxInDay, e.sessions);
  });
  const busyTeachers = Object.values(teacherSessionMap)
    .filter(t=>t.days.length >= 2)
    .map(t=>{
      // 單日 1 場 vs 單日 ≥ 2 場的表現差異
      const singleDays = t.days.filter(d=>d.sessions===1).map(d=>d.avg);
      const multiDays = t.days.filter(d=>d.sessions>=2).map(d=>d.avg);
      return {
        ...t,
        singleAvg: singleDays.length? mean(singleDays):null,
        multiAvg: multiDays.length? mean(multiDays):null,
        singleN: singleDays.length,
        multiN: multiDays.length,
        delta: (singleDays.length && multiDays.length)? mean(multiDays) - mean(singleDays) : null
      };
    })
    .filter(t=>t.delta != null)
    .sort((a,b)=>a.delta-b.delta);  // 下滑最明顯的排在前面

  let corrMsg = "";
  if(!isNaN(correlation)){
    if(correlation <= -0.3){
      corrMsg = `<span style="color:var(--bad)">單日場次越多，表現明顯下降</span>（r = ${correlation.toFixed(2)}）`;
    } else if(correlation >= 0.3){
      corrMsg = `<span style="color:var(--good)">單日場次越多，表現反而上升</span>（r = ${correlation.toFixed(2)}）— 可能是熱身效應`;

    }
  }

  return `
    <div class="insight-box" style="margin-bottom:16px">
      <b>整體相關性分析：</b>${corrMsg}
      <br><span style="font-size:11px;color:var(--text-faint)">皮爾遜相關係數 r ∈ [-1, +1]，|r| ≥ 0.3 才有統計意義。基於 ${allDays.length} 筆「老師×當日」資料。</span>

    <div class="dim-grid" style="margin-bottom:20px">
      ${levelStats.map(s=>{

          <div class="dname">單日 ${s.sessions} 場<br><span style="color:var(--text-faint)">${s.dayCount} 次</span></div>
          <div class="dbar" style="--p:${pct}%"></div>
          <div class="dval ${s.avg>=4?'high':s.avg>=3.3?'mid':'low'}">${s.avg.toFixed(2)}</div>
          <div class="dname" style="text-align:right;font-size:10px">${s.min.toFixed(1)}~${s.max.toFixed(1)}</div>
        </div>`;
      }).join("")}
    </div>

    ${busyTeachers.length? `
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px">個別老師：單日 1 場 vs 多場表現</div>
      <div class="combo-list">
        ${busyTeachers.slice(0,5).map(t=>{
          const col = t.delta<=-0.3?'var(--bad)':t.delta>=0.3?'var(--good)':'var(--text-dim)';
          const label = t.delta<=-0.3?"多場時下滑":t.delta>=0.3?"多場時更穩":"無明顯差異";
          return `<div class="combo-row" style="grid-template-columns:1fr auto auto auto">
            <div class="name teacher">${escapeHtml(t.teacher)}</div>
            <div class="combo-meta">1 場 <b style="color:var(--text)">${t.singleAvg?t.singleAvg.toFixed(2):'—'}</b> (n=${t.singleN})</div>
            <div class="combo-meta">≥2 場 <b style="color:var(--text)">${t.multiAvg?t.multiAvg.toFixed(2):'—'}</b> (n=${t.multiN})</div>
            <div style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;color:${col};min-width:90px;text-align:right">${t.delta>=0?'+':''}${t.delta.toFixed(2)}<br><span style="font-size:9px;font-weight:400">${label}</span></div>
          </div>`;
        }).join("")}
      </div>
    `:""}
  `;
}

// 皮爾遜相關係數
function pearson(xs, ys){
  const n = xs.length;
  if(n < 2) return NaN;
  const mx = mean(xs), my = mean(ys);
  let num=0, dx=0, dy=0;
  for(let i=0;i<n;i++){
    num += (xs[i]-mx)*(ys[i]-my);
    dx += (xs[i]-mx)*(xs[i]-mx);
    dy += (ys[i]-my)*(ys[i]-my);
  }
  if(dx===0 || dy===0) return NaN;
  return num / Math.sqrt(dx*dy);
}

// ---------- RECOMMENDER ----------
function runRecommender(){
  const targetAge = parseFloat(document.getElementById("recAge").value);
  const targetWeekday = document.getElementById("recWeekday").value; // "0"~"6"
  const emphasis = document.getElementById("recEmphasis").value;   // "ENG"|... 或 ""
  const minCount = parseInt(document.getElementById("recMinCount").value) || 2;

  const hasAge = !isNaN(targetAge);
  const hasWeekday = targetWeekday !== "";
  const hasEmphasis = !!emphasis;

  // 對每位老師計算分數
  const candidates = STATE.teachers.filter(t=>t.count >= minCount && t.avg != null);
  if(!candidates.length){
    document.getElementById("recResults").innerHTML = `<div class="rec-empty">沒有符合「筆數 ≥ ${minCount}」的老師</div>`;
    return;
  }

  // 年齡分組邏輯（和 processRows 裡一致）
  function ageGroupOf(age){
    if(age == null) return "未知";
    if(age < 6) return "幼齡 (3-5)";
    if(age < 10) return "小學 (6-9)";
    return "高年級+ (10+)";
  }
  const targetGroup = hasAge? ageGroupOf(targetAge): null;

  const scored = candidates.map(t=>{
    // 基礎分：老師整體均分（0-5 轉 0-100）
    const baseScore = (t.avg / 5) * 100;

    // 年齡匹配分：該老師在該年齡段的均分
    let ageScore = baseScore;
    let ageN = 0;
    let ageRowsAvg = null;
    if(hasAge){
      const matchRows = t.rows.filter(r=>ageGroupOf(r.age) === targetGroup && r.avg!=null);
      if(matchRows.length){
        ageRowsAvg = mean(matchRows.map(r=>r.avg));
        ageScore = (ageRowsAvg / 5) * 100;
        ageN = matchRows.length;
      }
    }

    // 星期匹配分
    let weekdayScore = baseScore;
    let weekdayN = 0;
    let weekdayAvg = null;
    if(hasWeekday){
      const matchRows = t.rows.filter(r=>{
        try{
          const dt = new Date(r.date.replace(/\//g,"-"));
          return !isNaN(dt) && String(dt.getDay()) === targetWeekday && r.avg!=null;
        }catch(e){ return false; }
      });
      if(matchRows.length){
        weekdayAvg = mean(matchRows.map(r=>r.avg));
        weekdayScore = (weekdayAvg / 5) * 100;
        weekdayN = matchRows.length;
      }
    }

    // 重視維度分
    let emphasisScore = baseScore;
    let emphasisVal = null;
    if(hasEmphasis && t.dimAvg[emphasis] != null){
      emphasisVal = t.dimAvg[emphasis];
      emphasisScore = (emphasisVal / 5) * 100;
    }

    // 樣本信賴度：根據筆數給 0~1 加權（2 筆 0.5、5 筆 0.85、10+ 筆 1.0）
    const confidence = Math.min(1, Math.log10(t.count + 1) / Math.log10(11));

    // 綜合計分：
    // - 若有年齡條件：年齡分佔 40%
    // - 若有星期條件：星期分佔 20%
    // - 若有重視維度：維度分佔 30%
    // - 基礎分補齊剩餘
    let weights = { age:0, weekday:0, emphasis:0, base:0 };
    if(hasAge) weights.age = 0.40;
    if(hasWeekday) weights.weekday = 0.20;
    if(hasEmphasis) weights.emphasis = 0.30;
    weights.base = 1 - weights.age - weights.weekday - weights.emphasis;

    // 如果該條件沒樣本，該權重退回基礎分，以免扣分
    const safeAge = ageN > 0 ? ageScore : baseScore;
    const safeWeekday = weekdayN > 0 ? weekdayScore : baseScore;

    const rawScore = safeAge * weights.age + safeWeekday * weights.weekday + emphasisScore * weights.emphasis + baseScore * weights.base;
    // 乘上信賴度（信賴度低的老師拉下一點分數）
    const finalScore = rawScore * (0.6 + 0.4 * confidence);

    return {
      teacher: t,
      score: finalScore,
      baseScore, ageScore, weekdayScore, emphasisScore,
      ageN, ageRowsAvg, weekdayN, weekdayAvg, emphasisVal,
      confidence, weights
    };
  }).sort((a,b)=>b.score - a.score);

  const top3 = scored.slice(0, 3);
  const weekdayMap = ["週日","週一","週二","週三","週四","週五","週六"];
  const conditions = [];
  if(hasAge) conditions.push(`年齡 <b>${targetAge}歲</b>（${targetGroup}）`);
  if(hasWeekday) conditions.push(`<b>${weekdayMap[parseInt(targetWeekday)]}</b>`);
  if(hasEmphasis){
    const d = DIMS.find(x=>x.key===emphasis);
    conditions.push(`重視 <b>${d.label}</b>`);
  }

  const html = `
    ${conditions.length? `<div style="font-size:12px;color:var(--text-dim);margin-top:14px">推薦條件：${conditions.join(" · ")}</div>`:""}
    <div class="rec-results">
      ${top3.map((r, i)=>{
        const cls = i===0?'gold':i===1?'silver':'bronze';
        const rankLabel = i===0?'🥇 最佳':i===1?'🥈 次選':'🥉 備選';
        const reasons = [];
        if(hasAge){
          if(r.ageN > 0){
            const sign = r.ageRowsAvg >= r.teacher.avg ? "擅長" : "表現一般";
            reasons.push(`對 <b>${targetGroup}</b> ${sign}（該齡段均分 ${r.ageRowsAvg.toFixed(2)}，n=${r.ageN}）`);
          } else {
            reasons.push(`⚠ 未曾教過 <b>${targetGroup}</b>，使用整體表現估算`);
          }
        }
        if(hasWeekday){
          if(r.weekdayN > 0){
            reasons.push(`${weekdayMap[parseInt(targetWeekday)]} 歷史表現 <b>${r.weekdayAvg.toFixed(2)}</b>（n=${r.weekdayN}）`);
          } else {
            reasons.push(`⚠ 無 ${weekdayMap[parseInt(targetWeekday)]} 資料`);
          }
        }
        if(hasEmphasis && r.emphasisVal != null){
          const d = DIMS.find(x=>x.key===emphasis);
          reasons.push(`${d.label} <b>${r.emphasisVal.toFixed(2)}</b>`);
        }
        const confLabel = r.confidence >= 0.85? "高":r.confidence >= 0.6? "中":"低";
        return `<div class="rec-card ${cls}" data-teacher="${escapeAttr(r.teacher.name)}">
          <div class="rec-rank">${rankLabel}</div>
          <div class="rec-name">${escapeHtml(r.teacher.name)}</div>
          <div class="rec-score-row">
            <div class="rec-score" style="color:${scoreColor(r.teacher.avg)}">${r.score.toFixed(1)}</div>
            <div class="rec-label">推薦分數 / 100</div>
          </div>
          <div class="rec-breakdown">
            <div class="rec-breakdown-row">
              <span>整體均分</span>
              <div class="rec-bar" style="--p:${(r.teacher.avg/5*100)}%"></div>
              <b style="color:${scoreColor(r.teacher.avg)}">${r.teacher.avg.toFixed(2)}</b>
            </div>
            <div class="rec-breakdown-row">
              <span>Demo 筆數</span>
              <div class="rec-bar" style="--p:${r.confidence*100}%"></div>
              <b>${r.teacher.count}（信賴${confLabel}）</b>
            </div>
            ${hasAge? `<div class="rec-breakdown-row">
              <span>${targetGroup}</span>
              <div class="rec-bar" style="--p:${r.ageN>0?(r.ageRowsAvg/5*100):0}%"></div>
              <b>${r.ageN>0?r.ageRowsAvg.toFixed(2):'—'}</b>
            </div>`:""}
            ${hasWeekday? `<div class="rec-breakdown-row">
              <span>${weekdayMap[parseInt(targetWeekday)]}</span>
              <div class="rec-bar" style="--p:${r.weekdayN>0?(r.weekdayAvg/5*100):0}%"></div>
              <b>${r.weekdayN>0?r.weekdayAvg.toFixed(2):'—'}</b>
            </div>`:""}
          </div>
          <div class="rec-reason">${reasons.join("<br>")}</div>
        </div>`;
      }).join("")}
    </div>
  `;
  document.getElementById("recResults").innerHTML = html;

  // 卡片點擊跳轉
  document.querySelectorAll(".rec-card[data-teacher]").forEach(el=>{
    el.addEventListener("click",()=>{
      STATE.viewMode = "teacher";
      STATE.selected = el.dataset.teacher;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });
}

function renderSelfStrictness(me){
  const teamAvg = mean(STATE.rows.map(r=>r.avg).filter(x=>x!=null));
  const myAvg = me.avg;
  const delta = myAvg - teamAvg;

  // 另一位最嚴格與最鬆的顧問（團隊對照）
  const allCons = aggregateByConsultant().filter(c=>c.count>=2);
  const strictest = [...allCons].sort((a,b)=>a.avg-b.avg)[0];
  const lenient = [...allCons].sort((a,b)=>b.avg-a.avg)[0];

  // 將 delta 轉換為百分比位置（-1.0 到 +1.0 對應 0%~100%）
  const range = 1.0;
  const pct = Math.max(0, Math.min(100, ((delta + range) / (range*2)) * 100));

  let label, color;
  if(delta <= -0.3){ label = "你給分偏嚴"; color = "var(--bad)"; }
  else if(delta <= -0.15){ label = "你略偏嚴格"; color = "var(--warn)"; }
  else if(delta >= 0.3){ label = "你給分偏鬆"; color = "var(--good)"; }
  else if(delta >= 0.15){ label = "你略偏寬鬆"; color = "var(--info)"; }
  else { label = "你中立客觀"; color = "var(--accent)"; }

  return `
    <div class="self-strictness">
      <div>
        <div class="ss-label">我的給分風格</div>
        <div class="ss-name">${escapeHtml(me.name)}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);margin-top:4px">${me.count} 筆 · ${me.teacherCount} 位老師</div>
      </div>
      <div class="ss-gauge">
        <div class="ss-gauge-bar"></div>
        <div class="ss-gauge-pos" style="left:${pct}%;background:${color}"></div>
        <div class="ss-gauge-ticks">
          <span>嚴格 -1.0</span>
          <span>團隊平均</span>
          <span>寬鬆 +1.0</span>
        </div>
      </div>
      <div class="ss-result" style="color:${color}">
        ${label}
        <span class="ss-delta">我 <b style="color:var(--text)">${myAvg.toFixed(2)}</b> vs 團隊 <b style="color:var(--text)">${teamAvg.toFixed(2)}</b> = <b>${delta>=0?'+':''}${delta.toFixed(2)}</b></span>
        <span class="ss-delta" style="margin-top:4px;color:var(--text-faint)">團隊最嚴 ${escapeHtml(strictest.name)} ${strictest.avg.toFixed(2)} · 最鬆 ${escapeHtml(lenient.name)} ${lenient.avg.toFixed(2)}</span>
      </div>
    </div>
  `;
}

// 年齡段 × 星期 熱力圖
function aggregateAgeWeekday(filterFn){
  // key: "ageGroup||weekday" (weekday 0-6, Sun-Sat)
  const map = {};
  STATE.rows.forEach(r=>{
    if(r.avg==null) return;
    if(filterFn && !filterFn(r)) return;
    try{
      const dt = new Date(r.date.replace(/\//g,"-"));
      if(isNaN(dt)) return;
      const wd = dt.getDay();
      const key = r.ageGroup + "||" + wd;
      if(!map[key]) map[key] = {ageGroup:r.ageGroup, weekday:wd, rows:[]};
      map[key].rows.push(r);
    }catch(e){}
  });
  return Object.values(map).map(e=>{
    const avgs = e.rows.map(r=>r.avg).filter(x=>x!=null);
    return {
      ageGroup: e.ageGroup, weekday: e.weekday,
      rows: e.rows, count: e.rows.length,
      avg: avgs.length? mean(avgs): null
    };
  });
}

function renderAgeWeekdayHeatmap(){
  const data = aggregateAgeWeekday();
  if(!data.length) return `<div class="rec-empty">無足夠資料生成熱力圖</div>`;

  const weekdays = [1,2,3,4,5,6,0];  // 週一~週日
  const weekdayNames = {0:"週日", 1:"週一", 2:"週二", 3:"週三", 4:"週四", 5:"週五", 6:"週六"};
  const ageOrder = ["幼齡 (3-5)","小學 (6-9)","高年級+ (10+)","未知"];

  const lookup = {};
  data.forEach(d=>{ lookup[d.ageGroup + "||" + d.weekday] = d; });

  // 每個 ageGroup 找最佳星期
  const bestPerAge = {};
  ageOrder.forEach(ag=>{
    let best = null;
    weekdays.forEach(wd=>{
      const c = lookup[ag + "||" + wd];
      if(c && c.avg != null && c.count >= 2){
        if(!best || c.avg > best.avg) best = c;
      }
    });
    if(best) bestPerAge[ag] = best.weekday;
  });

  let html = `<div class="age-weekday-wrap"><table class="age-weekday"><thead><tr><th class="corner">年齡段 ＼ 星期</th>`;
  weekdays.forEach(wd=>html += `<th>${weekdayNames[wd]}</th>`);
  html += `<th>該段總平均</th></tr></thead><tbody>`;

  ageOrder.forEach(ag=>{
    if(!data.some(d=>d.ageGroup===ag)) return;
    html += `<tr><th>${escapeHtml(ag)}</th>`;
    const rowAvgs = [];
    weekdays.forEach(wd=>{
      const c = lookup[ag+"||"+wd];
      if(!c){
        html += `<td class="empty"></td>`;
      } else {
        const isBest = bestPerAge[ag] === wd;
        const color = heatColor(c.avg);
        html += `<td class="aw-cell ${isBest?'best-in-row':''}" data-key="${escapeAttr(ag+"||"+wd)}" style="background:${color}" title="${escapeAttr(ag)} · ${weekdayNames[wd]} · ${c.count} 場 · 均分 ${c.avg.toFixed(2)}${isBest?' (該年齡段最佳)':''}">
          <span class="awv">${c.avg.toFixed(2)}</span>
          <span class="awn">n=${c.count}</span>
        </td>`;
        rowAvgs.push(c.avg);
      }
    });
    const rowAvg = rowAvgs.length? mean(rowAvgs): null;
    html += `<td style="background:${heatColor(rowAvg)}"><span class="awv">${rowAvg?rowAvg.toFixed(2):'—'}</span></td></tr>`;
  });
  html += `</tbody></table></div>`;
  return html;
}

function showAgeWeekdayDetail(key){
  const [ageGroup, wd] = key.split("||");
  const weekdayNames = {0:"週日", 1:"週一", 2:"週二", 3:"週三", 4:"週四", 5:"週五", 6:"週六"};
  const weekdayNum = parseInt(wd);
  const rows = STATE.rows.filter(r=>{
    if(r.ageGroup !== ageGroup) return false;
    try{ const dt = new Date(r.date.replace(/\//g,"-")); return !isNaN(dt) && dt.getDay()===weekdayNum; }
    catch(e){ return false; }
  });

  // 按老師聚合
  const teacherMap = {};
  rows.forEach(r=>{
    if(!teacherMap[r.teacher]) teacherMap[r.teacher] = {name:r.teacher, rows:[]};
    teacherMap[r.teacher].rows.push(r);
  });
  const teachers = Object.values(teacherMap).map(t=>{
    const avgs = t.rows.map(r=>r.avg).filter(x=>x!=null);
    return {name:t.name, count:t.rows.length, avg:avgs.length?mean(avgs):null, rows:t.rows};
  }).sort((a,b)=>(b.avg||0)-(a.avg||0));

  const avgs = rows.map(r=>r.avg).filter(x=>x!=null);
  const groupAvg = avgs.length? mean(avgs):null;

  const modal = document.createElement("div");
  modal.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:1000;padding:20px";
  modal.innerHTML = `
    <div style="background:var(--panel);border:1px solid var(--line);max-width:780px;width:100%;max-height:85vh;overflow:auto;padding:24px">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:18px">
        <div>
          <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-faint);margin-bottom:4px">AGE × WEEKDAY DETAIL</div>
          <h2 style="font-family:'Noto Serif TC',serif;margin:0;font-size:22px;color:var(--text)">
            <span style="color:var(--info)">${escapeHtml(ageGroup)}</span> · <span style="color:var(--accent)">${weekdayNames[weekdayNum]}</span>
          </h2>
          <div style="font-size:12px;color:var(--text-dim);margin-top:4px">${rows.length} 場 · ${teachers.length} 位老師 · 組合均分 <b style="color:${scoreColor(groupAvg)}">${groupAvg?groupAvg.toFixed(2):'—'}</b></div>
        </div>
        <button onclick="this.closest('[style*=fixed]').remove()" style="background:var(--bg-2);border:1px solid var(--line-2);color:var(--text);padding:6px 14px;cursor:pointer;font-family:inherit">✕ 關閉</button>
      </div>

      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px">該組合表現最佳老師（由高到低）</div>
      <div class="combo-list" style="margin-bottom:18px">
        ${teachers.map((t,i)=>`<div class="combo-row mod-rank-row" data-teacher="${escapeAttr(t.name)}" style="grid-template-columns:22px 1fr auto auto">
          <div class="rank">#${i+1}</div>
          <div class="name teacher">${escapeHtml(t.name)}</div>
          <div class="combo-score" style="color:${scoreColor(t.avg)}">${t.avg?t.avg.toFixed(2):'—'}</div>
          <div class="combo-meta">${t.count} 場</div>
        </div>`).join("")}
      </div>

      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:10px">所有 Demo 明細</div>
      <div class="fb-list" style="max-height:360px">
        ${rows.map(r=>rowHtml(r)).join("")}
      </div>
    </div>
  `;
  modal.addEventListener("click",(e)=>{ if(e.target===modal) modal.remove(); });
  document.body.appendChild(modal);

  // 關閉 modal 並跳到老師
  modal.querySelectorAll(".mod-rank-row[data-teacher]").forEach(el=>{
    el.addEventListener("click",()=>{
      const name = el.dataset.teacher;
      modal.remove();
      STATE.currentRole = "full";
      STATE.viewMode = "teacher";
      STATE.selected = name;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });
}

function renderMyTeachers(me){
  // 該顧問合作過的老師按分數排序
  const teacherMap = {};
  me.rows.forEach(r=>{
    if(!teacherMap[r.teacher]) teacherMap[r.teacher] = {name:r.teacher, rows:[]};
    teacherMap[r.teacher].rows.push(r);
  });
  const teachers = Object.values(teacherMap).map(t=>{
    const avgs = t.rows.map(r=>r.avg).filter(x=>x!=null);
    // 顧問跟老師的整體化學反應
    const dimAvg = {};
    DIMS.forEach(d=>{
      const arr = t.rows.map(r=>r[d.key]).filter(x=>x!=null);
      dimAvg[d.key] = arr.length? mean(arr):null;
    });
    // 這個老師在團隊的整體均分（非僅此顧問）
    const overall = STATE.teachers.find(x=>x.name===t.name);
    const overallAvg = overall? overall.avg:null;
    const ourAvg = avgs.length? mean(avgs):null;
    return {
      name: t.name, count:t.rows.length, ourAvg, overallAvg,
      delta: (ourAvg!=null && overallAvg!=null)? ourAvg - overallAvg : null,
      dimAvg
    };
  }).sort((a,b)=>(b.ourAvg||0)-(a.ourAvg||0));

  if(!teachers.length) return `<div class="empty">尚無資料</div>`;

  return `<div class="combo-list">
    ${teachers.map(t=>{
      const col = t.delta==null?'var(--text-faint)':t.delta>=0.2?'var(--good)':t.delta<=-0.2?'var(--bad)':'var(--text-dim)';
      const sign = t.delta==null?'—':(t.delta>=0?'+':'')+t.delta.toFixed(2);
      return `<div class="combo-row rank-row" data-teacher="${escapeAttr(t.name)}" style="grid-template-columns:1fr auto auto auto auto">
        <div class="name teacher">${escapeHtml(t.name)}</div>
        <div class="combo-meta">${t.count} 場合作</div>
        <div class="combo-meta">整體 ${t.overallAvg?t.overallAvg.toFixed(2):'—'}</div>
        <div class="combo-score" style="color:${scoreColor(t.ourAvg)}">${t.ourAvg?t.ourAvg.toFixed(2):'—'}</div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:12px;font-weight:700;color:${col};min-width:80px;text-align:right">
          ${sign}<br><span style="font-size:9px;color:var(--text-faint);font-weight:400">vs 整體</span>
        </div>
      </div>`;
    }).join("")}
  </div>
  <div class="legend-mini" style="margin-top:12px">
    <span>Δ ≥ +0.20 = <span style="color:var(--good)">你跟這位老師特別合拍</span></span>
    <span>Δ ≤ -0.20 = <span style="color:var(--bad)">這組化學反應欠佳，建議避免</span></span>
  </div>`;
}

// 學員配對推薦器 — 輸入年齡，自動找最佳 weekday + 老師清單
function runPicker(){
  const ageRaw = document.getElementById("pickerAge").value;
  if(!ageRaw){
    document.getElementById("pickerResults").innerHTML = `<div class="rec-empty">請先選擇學員年齡</div>`;
    return;
  }
  const age = parseInt(ageRaw);
  const topN = parseInt(document.getElementById("pickerTopN").value) || 5;
  const minCount = parseInt(document.getElementById("pickerMin").value) || 2;

  // 判斷年齡段
  const targetGroup = age < 6 ? "幼齡 (3-5)" : age < 10 ? "小學 (6-9)" : "高年級+ (10+)";
  const weekdayNames = {0:"週日", 1:"週一", 2:"週二", 3:"週三", 4:"週四", 5:"週五", 6:"週六"};

  // 抓該年齡段在每個 weekday 的表現
  const wdMap = {};
  STATE.rows.forEach(r=>{
    if(r.ageGroup !== targetGroup || r.avg==null) return;
    try{
      const dt = new Date(r.date.replace(/\//g,"-"));
      if(isNaN(dt)) return;
      const wd = dt.getDay();
      if(!wdMap[wd]) wdMap[wd] = [];
      wdMap[wd].push(r);
    }catch(e){}
  });

  if(!Object.keys(wdMap).length){
    document.getElementById("pickerResults").innerHTML = `<div class="rec-empty">該年齡段（${targetGroup}）尚無任何資料</div>`;
    return;
  }

  // 每個 weekday 的統計
  const wdStats = Object.entries(wdMap).map(([wd, rows])=>{
    const avgs = rows.map(r=>r.avg);
    return {wd:parseInt(wd), wdName:weekdayNames[wd], count:rows.length, avg:mean(avgs), rows};
  }).sort((a,b)=>b.avg-a.avg);

  const bestWd = wdStats[0];

  // 在最佳星期內，按老師聚合排名
  const teacherMap = {};
  bestWd.rows.forEach(r=>{
    if(!teacherMap[r.teacher]) teacherMap[r.teacher] = {name:r.teacher, rows:[]};
    teacherMap[r.teacher].rows.push(r);
  });
  const bestTeachers = Object.values(teacherMap).map(t=>{
    const avgs = t.rows.map(r=>r.avg);
    return {name:t.name, count:t.rows.length, avg:mean(avgs), rows:t.rows};
  }).filter(t=>t.count >= minCount).sort((a,b)=>b.avg-a.avg);

  // 同時也抓該年齡段 × 所有星期的老師排名（不限星期的 fallback）
  const overallTeacherMap = {};
  STATE.rows.forEach(r=>{
    if(r.ageGroup !== targetGroup || r.avg==null) return;
    if(!overallTeacherMap[r.teacher]) overallTeacherMap[r.teacher] = {name:r.teacher, rows:[]};
    overallTeacherMap[r.teacher].rows.push(r);
  });
  const overallTeachers = Object.values(overallTeacherMap).map(t=>{
    const avgs = t.rows.map(r=>r.avg);
    return {name:t.name, count:t.rows.length, avg:mean(avgs)};
  }).filter(t=>t.count >= minCount).sort((a,b)=>b.avg-a.avg).slice(0, topN);

  const shownTeachers = bestTeachers.length >= 2 ? bestTeachers.slice(0,topN) : overallTeachers;
  const fallbackNote = bestTeachers.length < 2;

  document.getElementById("pickerResults").innerHTML = `
    <div style="margin-top:18px;padding:14px 16px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.3);border-left:3px solid var(--accent)">
      <div style="font-family:'JetBrains Mono',monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);margin-bottom:8px;font-weight:700">✨ 分析結果</div>
      <div style="font-size:14px;line-height:1.8;color:var(--text)">
        <b>${age} 歲</b> 學員屬於 <b style="color:var(--info)">${targetGroup}</b> 年齡段，歷史資料 ${Object.values(wdMap).reduce((a,b)=>a+b.length,0)} 筆。<br>
        最佳安排日：<b style="color:var(--good);font-size:18px">${bestWd.wdName}</b>（團隊均分 <b>${bestWd.avg.toFixed(2)}</b>，n=${bestWd.count}）
      </div>
    </div>

    <div style="margin-top:14px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-faint);letter-spacing:1px">星期分佈（高→低）</div>
    <div class="combo-list" style="margin-top:8px;margin-bottom:18px">
      ${wdStats.map((w,i)=>{
        const pct = (w.avg/5*100).toFixed(0);
        return `<div class="combo-row" style="grid-template-columns:22px 1fr auto auto;cursor:default">
          <div class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
          <div class="name" style="color:var(--text)">${w.wdName}</div>
          <div class="combo-score" style="color:${scoreColor(w.avg)}">${w.avg.toFixed(2)}</div>
          <div class="combo-meta">${w.count} 場</div>
        </div>`;
      }).join("")}
    </div>

    <div style="font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px">
      ${fallbackNote? `⚠ ${bestWd.wdName} 符合條件的老師太少，改列該年齡段所有老師`:`🏆 ${bestWd.wdName} × ${targetGroup} 表現 Top ${shownTeachers.length}`}
    </div>
    <div class="combo-list">
      ${shownTeachers.map((t,i)=>`<div class="combo-row rank-row" data-teacher="${escapeAttr(t.name)}" style="grid-template-columns:22px 1fr auto auto auto">
        <div class="rank">${i===0?'🥇':i===1?'🥈':i===2?'🥉':'#'+(i+1)}</div>
        <div class="name teacher">${escapeHtml(t.name)}</div>
        <div class="combo-score" style="color:${scoreColor(t.avg)}">${t.avg.toFixed(2)}</div>
        <div class="combo-meta">${t.count} 場</div>
        <div class="combo-meta" style="color:var(--accent);font-weight:500">→ 戰力表</div>
      </div>`).join("")}
    </div>
  `;

  // 綁定點擊
  document.querySelectorAll("#pickerResults .rank-row[data-teacher]").forEach(el=>{
    el.addEventListener("click",()=>{
      STATE.currentRole = "full";
      STATE.viewMode = "teacher";
      STATE.selected = el.dataset.teacher;
      render();
      window.scrollTo({top:0, behavior:"smooth"});
    });
  });
}

// 🚨 需關注老師清單
function renderAlertList(){
  const alerts = [];

  STATE.teachers.forEach(t=>{
    if(t.count < 2) return;

    // 規則 1: 連續 3 場低於 3.5
    const sorted = [...t.rows].sort((a,b)=>new Date(a.date.replace(/\//g,"-"))-new Date(b.date.replace(/\//g,"-")));
    const last3 = sorted.slice(-3).map(r=>r.avg).filter(x=>x!=null);
    if(last3.length >= 3 && last3.every(v=>v<3.5)){
      alerts.push({
        teacher: t.name, level:"bad", icon:"🚨",
        reason: `最近 <b>3 場連續低分</b>：${last3.map(v=>v.toFixed(1)).join(" → ")}`,
        stat: mean(last3).toFixed(2), statLabel: "近 3 場均分"
      });
    }

    // 規則 2: 整體均分 < 3.2 且筆數 >= 3
    if(t.avg != null && t.avg < 3.2 && t.count >= 3){
      alerts.push({
        teacher:t.name, level:"bad", icon:"⚠️",
        reason: `整體均分 <b>${t.avg.toFixed(2)}</b> 偏低（團隊均分 ${mean(STATE.rows.map(r=>r.avg).filter(x=>x!=null)).toFixed(2)}）`,
        stat: t.avg.toFixed(2), statLabel: "整體均分"
      });
    }

    // 規則 3: 收到教務反饋後表現未改善
    const adminRows = sorted.filter(r=>r.adminNote && r.adminNote.trim());
    if(adminRows.length){
      let noImprovement = 0;
      adminRows.forEach(ar=>{
        const idx = sorted.indexOf(ar);
        const after = sorted.slice(idx+1, idx+4).map(r=>r.avg).filter(x=>x!=null);
        const before = sorted.slice(Math.max(0,idx-3), idx).map(r=>r.avg).filter(x=>x!=null);
        if(before.length && after.length){
          if(mean(after) < mean(before) - 0.1) noImprovement++;
        }
      });
      if(noImprovement > 0 && noImprovement >= Math.ceil(adminRows.length/2)){
        alerts.push({
          teacher:t.name, level:"warn", icon:"📉",
          reason: `收到 <b>${adminRows.length} 次</b> 教務反饋，${noImprovement} 次後平均表現反而下降`,
          stat: noImprovement + "/" + adminRows.length, statLabel:"未改善次數"
        });
      }
    }

    // 規則 4: 年齡段表現落差大
    const byGroup = {};
    t.rows.forEach(r=>{
      if(r.avg==null) return;
      if(!byGroup[r.ageGroup]) byGroup[r.ageGroup] = [];
      byGroup[r.ageGroup].push(r.avg);
    });
    const groupAvgs = Object.entries(byGroup)
      .filter(([g,arr])=>g !== "未知" && arr.length >= 2)
      .map(([g,arr])=>({group:g, avg:mean(arr), n:arr.length}));
    if(groupAvgs.length >= 2){
      const best = [...groupAvgs].sort((a,b)=>b.avg-a.avg)[0];
      const worst = [...groupAvgs].sort((a,b)=>a.avg-b.avg)[0];
      if(best.avg - worst.avg >= 1.2 && worst.avg < 3.5){
        alerts.push({
          teacher:t.name, level:"warn", icon:"⚖️",
          reason: `年齡掌握不均：<b>${best.group}</b> ${best.avg.toFixed(2)} vs <b>${worst.group}</b> ${worst.avg.toFixed(2)}（差 ${(best.avg-worst.avg).toFixed(2)}）`,
          stat: (best.avg-worst.avg).toFixed(2), statLabel: "年齡落差"
        });
      }
    }
  });

  if(!alerts.length) return `<div class="rec-empty" style="color:var(--good)">✅ 目前無異常訊號，團隊狀況良好</div>`;

  // 同一老師合併（避免重複）
  const grouped = {};
  alerts.forEach(a=>{
    if(!grouped[a.teacher]) grouped[a.teacher] = [];
    grouped[a.teacher].push(a);
  });

  return `<div class="alert-grid">
    ${Object.entries(grouped).map(([name, items])=>{
      const worst = items.some(i=>i.level==="bad") ? "bad" : "warn";
      const icon = items[0].icon;
      return `<div class="alert-card ${worst} rank-row" data-teacher="${escapeAttr(name)}">
        <div class="alert-icon">${icon}</div>
        <div class="alert-body">
          <div class="alert-name">${escapeHtml(name)}</div>
          ${items.map(i=>`<div class="alert-reason">${i.reason}</div>`).join("")}
        </div>
        <div class="alert-stat">
          <b>${items[0].stat}</b>
          <span>${items[0].statLabel}</span>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

// 📊 團隊五項短板
function renderTeamWeakness(){
  const rankedDims = DIMS.map(d=>({
    dim:d, avg: STATE.teamDimAvg[d.key], std: STATE.teamDimStd[d.key]
  })).sort((a,b)=>a.avg-b.avg);

  const weakest = rankedDims[0];
  const recommendations = {
    ENG: "建議安排「聲音感染力 / 教學熱情」內訓；可找熱情度 5 的老師做示範分享",
    PRO: "建議安排「系統操作 / 糾錯技巧」培訓；著重錯誤指正的時機與方式",
    PAC: "建議安排「教案節奏管理」內訓；可用碼表練習各段時間控制",
    INT: "建議安排「丟球技巧 / 引導式提問」培訓；重點在低程度學員的引導",
    RAP: "建議安排「兒童心理 / 親和力」培訓；針對害羞/內向孩子的破冰技巧"
  };

  return `
    <div class="dim-grid" style="margin-bottom:16px">
      ${rankedDims.map((r,i)=>{
        const pct = (r.avg/5*100).toFixed(0);
        const cls = r.avg>=4?'high':r.avg>=3.5?'mid':'low';
        const isWeakest = i === 0;
        return `<div class="dim-row" style="grid-template-columns:80px 1fr 56px 44px">

// 📢 教務反饋追蹤
function renderFeedbackTracking(){
  // 抓所有有教務反饋的筆 + 事件前後分析
  const teacherEvents = {};
  STATE.teachers.forEach(t=>{
    const sorted = [...t.rows].sort((a,b)=>new Date(a.date.replace(/\//g,"-"))-new Date(b.date.replace(/\//g,"-")));
    const events = [];
    sorted.forEach((r, i)=>{
      if(r.adminNote && r.adminNote.trim()){
        const before = sorted.slice(Math.max(0,i-3), i).map(x=>x.avg).filter(x=>x!=null);
        const after = sorted.slice(i+1, i+4).map(x=>x.avg).filter(x=>x!=null);
        events.push({
          date:r.date, note:r.adminNote, avg:r.avg,
          beforeAvg:before.length?mean(before):null,
          afterAvg:after.length?mean(after):null,
          delta: (before.length && after.length)? mean(after)-mean(before): null
        });
      }
    });
    if(events.length) teacherEvents[t.name] = events;
  });

  if(!Object.keys(teacherEvents).length) return `<div class="rec-empty">尚無教務反饋紀錄</div>`;

  // 計算每位老師的配合度（有有效前後對照的 delta 平均）
  const cooperation = Object.entries(teacherEvents).map(([name, events])=>{
    const withDelta = events.filter(e=>e.delta!=null);
    const avgDelta = withDelta.length? mean(withDelta.map(e=>e.delta)):null;
    return {name, events, eventCount:events.length, avgDelta, validCount:withDelta.length};
  }).sort((a,b)=>(b.avgDelta||0)-(a.avgDelta||0));

  return `<div class="alert-grid">
    ${cooperation.map(c=>{
      let level, icon, label;
      if(c.avgDelta == null){
        level = "info"; icon = "📄"; label = "無法判斷";
      } else if(c.avgDelta >= 0.3){
        level = "info"; icon = "✅"; label = "配合度高";
      } else if(c.avgDelta >= 0){
        level = "info"; icon = "🟡"; label = "略有改善";
      } else if(c.avgDelta >= -0.3){
        level = "warn"; icon = "🟠"; label = "無明顯改善";
      } else {
        level = "bad"; icon = "🔴"; label = "反饋後退步";
      }
      return `<div class="alert-card ${level} rank-row" data-teacher="${escapeAttr(c.name)}" style="border-left-color:${c.avgDelta==null?'var(--info)':c.avgDelta>=0.3?'var(--good)':c.avgDelta>=0?'var(--accent)':c.avgDelta>=-0.3?'var(--warn)':'var(--bad)'}">
        <div class="alert-icon">${icon}</div>
        <div class="alert-body">
          <div class="alert-name">${escapeHtml(c.name)}</div>
          <div class="alert-reason">
            共 <b>${c.eventCount} 次</b>教務反饋 · ${c.validCount} 次可分析前後 · 最新：<b>${c.events[c.events.length-1].date}</b>
          </div>
        </div>
        <div class="alert-stat">
          <b style="color:${c.avgDelta==null?'var(--text-faint)':c.avgDelta>=0?'var(--good)':'var(--bad)'}">${c.avgDelta==null?'—':(c.avgDelta>=0?'+':'')+c.avgDelta.toFixed(2)}</b>
          <span>${label}</span>
        </div>
      </div>`;
    }).join("")}
  </div>`;
}

// ---------- TEACHER ANALYSIS (pure math) ----------
function analyzeTeacher(t){
  const dimDelta = {};
  DIMS.forEach(d=>{
    const v = t.dimAvg[d.key];
    dimDelta[d.key] = v==null? null : v - STATE.teamDimAvg[d.key];
  });
  const validDimAvgs = DIMS.map(d=>t.dimAvg[d.key]).filter(x=>x!=null);
  const ownDimAvg = validDimAvgs.length? mean(validDimAvgs): 0;
  const dimOwnDelta = {};
  DIMS.forEach(d=>{
    const v = t.dimAvg[d.key];
    dimOwnDelta[d.key] = v==null? null : v - ownDimAvg;
  });
  const dimRates = {};
  DIMS.forEach(d=>{
    const arr = t.dims[d.key];
    dimRates[d.key] = {
      high: arr.length? (arr.filter(x=>x>=4).length / arr.length) : 0,
      low: arr.length? (arr.filter(x=>x<=2).length / arr.length) : 0,
      count: arr.length
    };
  });

  const strengths = DIMS.map(d=>({d, own:dimOwnDelta[d.key], team:dimDelta[d.key], rate:dimRates[d.key].high, val:t.dimAvg[d.key]}))
    .filter(x=>x.val!=null).sort((a,b)=>b.own-a.own);
  const weaknesses = [...strengths].reverse();

  const teamDelta = DIMS.map(d=>({d, delta:dimDelta[d.key], val:t.dimAvg[d.key], std:t.dimStd[d.key]})).filter(x=>x.val!=null);
  const mostAbove = teamDelta.length? [...teamDelta].sort((a,b)=>b.delta-a.delta)[0] : null;
  const mostBelow = teamDelta.length? [...teamDelta].sort((a,b)=>a.delta-b.delta)[0] : null;
  const totalStd = DIMS.map(d=>t.dimStd[d.key]).length? mean(DIMS.map(d=>t.dimStd[d.key])) : 0;

  const sorted = [...t.rows].sort((a,b)=>new Date(a.date.replace(/\//g,"-"))-new Date(b.date.replace(/\//g,"-")));
  const avgSeries = sorted.map(r=>r.avg).filter(x=>x!=null);
  const trendSlope = slope(avgSeries);
  const dimSlopes = {};
  DIMS.forEach(d=>{
    const s = sorted.map(r=>r[d.key]).filter(x=>x!=null);
    dimSlopes[d.key] = s.length>=2? slope(s) : 0;
  });

  const dimDist = {};
  DIMS.forEach(d=>{
    const counts = [0,0,0,0,0];
    t.dims[d.key].forEach(v=>{ if(v>=1 && v<=5) counts[Math.round(v)-1]++; });
    dimDist[d.key] = counts;
  });

  return { dimDelta, dimOwnDelta, dimRates, dimSlopes, dimDist,
    strengths, weaknesses, teamDelta, mostAbove, mostBelow, totalStd,
    trendSlope, avgSeries, sorted, ownDimAvg };
}

function renderConsultantScoreDist(rows){

  rows.forEach(r=>{

    if(b>=1 && b<=5) dist[b-1]++;

  const total = dist.reduce((a,b)=>a+b,0);
  return `<div style="margin-top:10px">
    ${[5,4,3,2,1].map(sc=>{
      const n = dist[sc-1];
      const pct = total? (n/total*100):0;
      return `<div class="dist-row s${sc}" style="margin-bottom:6px">
        <div class="dist-label">${sc} 分</div>
        <div class="dist-bar" style="--p:${pct}%"></div>

    高分率 (≥4): <b style="color:var(--good)">${total? ((dist[3]+dist[4])/total*100).toFixed(0):0}%</b> ·
    低分率 (≤2): <b style="color:var(--bad)">${total? ((dist[0]+dist[1])/total*100).toFixed(0):0}%</b>

              <div class="fb-meta" style="font-family:'JetBrains Mono',monospace">${scoreTxt}</div>

}
