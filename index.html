<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>

  --good:#06d6a0; --warn:#ffb545; --bad:#ef476f; --info:#4cc9f0; --purple:#b388eb;

*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Helvetica Neue",sans-serif;font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 10% -10%, rgba(255,209,102,.05), transparent 60%),radial-gradient(900px 500px at 110% 10%, rgba(239,71,111,.04), transparent 60%),var(--bg);min-height:100vh}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding-bottom:20px;border-bottom:1px solid var(--line);margin-bottom:24px;flex-wrap:wrap}

.meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.meta .chip{font-family:"JetBrains Mono",monospace;font-size:11px;padding:6px 10px;border:1px solid var(--line-2);border-radius:2px;color:var(--text-dim);background:var(--panel)}

.reload-btn{appearance:none;border:1px solid var(--line-2);background:var(--panel);color:var(--text);padding:8px 14px;font-family:"JetBrains Mono",monospace;font-size:11px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;transition:.15s}

.dist-row .dist-bar::after{content:"";position:absolute;left:0;top:0;bottom:0;background:var(--accent);width:var(--p,0%)}
.dist-row.s1 .dist-bar::after{background:var(--bad)}
.dist-row.s2 .dist-bar::after{background:#f07167}

.fb-item .fb-meta{font-family:"JetBrains Mono",monospace;font-size:10px;color:var(--text-faint);margin-bottom:4px;display:flex;gap:10px;flex-wrap:wrap;letter-spacing:.5px}
.fb-item .fb-meta b{color:var(--text-dim)}

.fb-list::-webkit-scrollbar,.tlist::-webkit-scrollbar{width:6px}
.fb-list::-webkit-scrollbar-thumb,.tlist::-webkit-scrollbar-thumb{background:var(--line-2)}
.fb-list::-webkit-scrollbar-track,.tlist::-webkit-scrollbar-track{background:var(--bg-2)}
.dim-grid{display:grid;gap:12px}
.dim-row{display:grid;grid-template-columns:72px 1fr 56px;gap:12px;align-items:center}
.dim-row .dname{font-family:"JetBrains Mono",monospace;font-size:11px;color:var(--text-dim);letter-spacing:.5px;line-height:1.3}
.dim-row .dbar{height:10px;background:var(--bg-2);position:relative;border:1px solid var(--line)}
.dim-row .dbar::after{content:"";position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--accent-2),var(--accent));width:var(--p,0%);transition:width .6s}

footer{margin-top:48px;padding-top:20px;border-top:1px solid var(--line);text-align:center;color:var(--text-faint);font-family:"JetBrains Mono",monospace;font-size:10px;letter-spacing:1.5px;text-transform:uppercase}
footer b{color:var(--accent)}
.insight-box{background:var(--bg-2);border-left:3px solid var(--info);padding:12px 14px;font-size:13px;line-height:1.7;color:var(--text-dim)}

<body>
<div class="wrap">

<header>
  <div>
    <h1><small>ETALKING / SALES INTERNAL TOOL</small>Demo 老師評比分析</h1>
  </div>
  <div class="meta">
    <span class="chip">資料來源 <b>DEMO老師反饋評比表</b></span>
    <span class="chip" id="dataStatus">載入中…</span>
    <button class="reload-btn" id="reloadBtn">重新載入</button>
  </div>
</header>

<div class="kpi" id="kpi"></div>

<div id="errorBox"></div>

<div class="layout">
  <aside class="tlist" id="tlist"></aside>
  <main class="main" id="main"></main>
</div>

<footer>BUILT FOR WOLF / ETALKING TAIPEI / REAL-TIME GOOGLE SHEETS SYNC · PURE DATA ANALYSIS</footer>
</div>

<script>
const SHEET_ID = "1qhgnCg93rq06yeDTefnyZHI7IVhg-rO1r1OQiwe6jXU";
const GID = "0";
// 用 gviz 端點（對瀏覽器 CORS 友善，避開 /export 的 307 跳轉）
// headers=0 告訴 Google 不要自動把第一列當 header（此表前 5 列是說明文字）
const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&gid=${GID}&headers=0`;
const DIMS = [
  {key:"ENG", label:"熱情度", desc:"老師單方面的表現/聲音感染力", color:"#ef476f"},
  {key:"PRO", label:"專業度", desc:"教學正確性、系統操作熟練度、糾錯能力", color:"#4cc9f0"},
  {key:"PAC", label:"時間掌控", desc:"教學流程流暢度、時間管理", color:"#ffd166"},
  {key:"INT", label:"互動參與", desc:"丟球能力、引導學員開口、應變", color:"#06d6a0"},
  {key:"RAP", label:"親和力", desc:"對學員的同理心、建立連結", color:"#b388eb"},
];

let STATE = {
  rows: [], teachers: [], teamDimAvg: {}, teamDimStd: {},
  selected: "__ALL__", sort: "count", charts: [],
};

async function fetchData(){
  document.getElementById("dataStatus").innerHTML = "載入中…";
  document.getElementById("reloadBtn").disabled = true;
  document.getElementById("errorBox").innerHTML = "";
  try{
    const resp = await fetch(GVIZ_URL + "&_=" + Date.now(), {cache:"no-store"});
    if(!resp.ok) throw new Error("HTTP " + resp.status + " — 表單可能非公開狀態");
    const text = await resp.text();
    // gviz 回傳格式：google.visualization.Query.setResponse({...});
    // 或 /*O_o*/\ngoogle.visualization.Query.setResponse({...});
    const jsonMatch = text.match(/setResponse\((.*)\)/s);
    if(!jsonMatch) throw new Error("無法解析 gviz 回傳格式");
    const json = JSON.parse(jsonMatch[1]);
    if(json.status === "error"){
      const r = json.errors && json.errors[0] ? json.errors[0].detailed_message : "未知錯誤";
      throw new Error("Google 回傳錯誤：" + r);
    }
    processGvizTable(json.table);
    document.getElementById("dataStatus").innerHTML = `共 <b>${STATE.rows.length}</b> 筆 / <b>${STATE.teachers.length}</b> 位老師 / 最後同步 ${new Date().toLocaleTimeString("zh-TW")}`;
    render();
  }catch(e){
    document.getElementById("errorBox").innerHTML = `<div class="error"><b>無法載入資料：</b> ${e.message}<br>
      請確認 Google 表單「共用設定」為「知道連結的任何人」皆可檢視。<br>
      若你是以 <code>file://</code> 本機檔案開啟，仍遇到 CORS 錯誤，請改用：
      <ul style="margin:6px 0 0 16px">
        <li>方法一：<b>將此 HTML 部署到 GitHub Pages</b>（最推薦）</li>
        <li>方法二：用 <code>python -m http.server</code> 起本機伺服器後訪問 <code>http://localhost:8000</code></li>
      </ul></div>`;
    document.getElementById("dataStatus").innerHTML = "載入失敗";
  }finally{
    document.getElementById("reloadBtn").disabled = false;
  }
}

// 將 gviz table 轉換為與原 processRows 相容的資料結構
function processGvizTable(table){
  if(!table || !table.rows) throw new Error("表單無資料");

  // headers=0 模式下，cols 通常沒用（或 label 為空），實際資料全在 rows
  // 直接把每個 row 的 c[] 轉成字串陣列
  const data = [];
  table.rows.forEach(r=>{
    if(!r || !r.c) return;
    const row = r.c.map(cell=>{
      if(cell == null) return "";
      // 日期類型：gviz 會把 v 設成 "Date(yyyy,m,d)" 字串，而 f 是已格式化的 "yyyy/m/d"
      // 所以優先用 f；若沒有 f 則嘗試解析 v
      if(cell.f != null && cell.f !== "") return String(cell.f);
      if(cell.v == null) return "";
      // 處理 gviz 的 "Date(2026,1,25)" 格式（month 是 0-indexed）
      const v = cell.v;
      if(typeof v === "string"){
        const dm = v.match(/^Date\((\d+),(\d+),(\d+)(?:,\d+,\d+,\d+)?\)$/);
        if(dm) return `${dm[1]}/${parseInt(dm[2])+1}/${parseInt(dm[3])}`;
      }
      return String(v);
    });
    data.push(row);
  });

  if(!data.length) throw new Error("表單資料為空");
  processRows(data);
}

function processRows(data){
  // gviz 的 headers=0 會把前面的說明列和標題列都吞掉，只剩下資料列（偶爾前面還有 1-2 列空白）
  // 策略：從「第一個首欄是日期格式」的列開始讀，不再依賴「找到 DEMO日期 標題」
  const isDate = s => /^\d{4}[\/\-]\d{1,2}[\/\-]\d{1,2}$/.test(String(s||"").trim());
  let startIdx = -1;
  for(let i=0;i<data.length;i++){
    if(data[i] && isDate(data[i][0])){ startIdx = i; break; }
  }
  if(startIdx === -1){
    const preview = data.slice(0,10).map((r,i)=>`[${i}] "${(r && r[0])? String(r[0]).slice(0,30): "(空)"}"`).join(" / ");
    throw new Error(`找不到任何日期格式的資料列。前 10 列首欄預覽：${preview}`);
  }

  const rows = [];
  for(let i=startIdx;i<data.length;i++){
    const r = data[i];
    if(!r || !r[0] || !r[1]) continue;
    const date = String(r[0]).trim();
    const teacher = String(r[1]).trim();
    if(!date || !teacher) continue;
    if(!isDate(date)) continue;  // 跳過非日期列（避免吃到任何意外的尾部說明）
    const parseNum = v => { const n = parseFloat(String(v).replace(/[^0-9.]/g,"")); return isNaN(n)?null:n; };
    const row = {
      date, teacher,
      student: String(r[2]||"").trim(),
      consultant: String(r[3]||"").trim(),
      ENG: parseNum(r[4]), PRO: parseNum(r[5]), PAC: parseNum(r[6]),
      INT: parseNum(r[7]), RAP: parseNum(r[8]),
      avg: parseNum(r[9]),
      room: String(r[10]||"").trim(),
      consultantNote: String(r[11]||"").trim(),
      adminNote: String(r[12]||"").trim(),
    };
    if([row.ENG,row.PRO,row.PAC,row.INT,row.RAP].every(x=>x===null)) continue;
    if(/^TEST\./i.test(row.teacher)) continue;
    rows.push(row);
  }

  const teamDimAvg = {}, teamDimStd = {};
  DIMS.forEach(d=>{
    const arr = rows.map(r=>r[d.key]).filter(x=>x!=null);
    teamDimAvg[d.key] = arr.length? mean(arr):0;
    teamDimStd[d.key] = arr.length? std(arr):0;
  });

  const map = {};
  rows.forEach(r=>{
    if(!map[r.teacher]) map[r.teacher] = {name:r.teacher, rows:[], dims:{ENG:[],PRO:[],PAC:[],INT:[],RAP:[]}};
    map[r.teacher].rows.push(r);
    DIMS.forEach(d=>{ if(r[d.key]!=null) map[r.teacher].dims[d.key].push(r[d.key]); });
  });
  const teachers = Object.values(map).map(t=>{
    const dimAvg = {}, dimStd = {};
    DIMS.forEach(d=>{
      dimAvg[d.key] = t.dims[d.key].length? mean(t.dims[d.key]) : null;
      dimStd[d.key] = t.dims[d.key].length>1? std(t.dims[d.key]) : 0;
    });
    const allAvgs = t.rows.map(r=>r.avg).filter(x=>x!=null);
    return {...t, dimAvg, dimStd, avg: allAvgs.length? mean(allAvgs): null, count: t.rows.length};
  });

  STATE.rows = rows;
  STATE.teachers = teachers;
  STATE.teamDimAvg = teamDimAvg;
  STATE.teamDimStd = teamDimStd;
}

function mean(arr){ return arr.reduce((a,b)=>a+b,0)/arr.length; }
function std(arr){ const m = mean(arr); return Math.sqrt(mean(arr.map(x=>(x-m)*(x-m)))); }
function slope(ys){
  const n = ys.length;
  if(n<2) return 0;
  const xs = ys.map((_,i)=>i);
  const mx = mean(xs), my = mean(ys);
  let num=0, den=0;
  for(let i=0;i<n;i++){ num += (xs[i]-mx)*(ys[i]-my); den += (xs[i]-mx)*(xs[i]-mx); }
  return den===0? 0 : num/den;
}

function destroyCharts(){ STATE.charts.forEach(c=>{try{c.destroy()}catch(e){}}); STATE.charts=[]; }

function render(){
  destroyCharts();
  renderKPI();
  renderTeacherList();
  renderMain();
}

function renderKPI(){
  const total = STATE.rows.length;
  const tcount = STATE.teachers.length;
  const overallAvg = mean(STATE.rows.map(r=>r.avg).filter(x=>x!=null));
  let best=["",-1], worst=["",99];
  DIMS.forEach(d=>{
    const v = STATE.teamDimAvg[d.key];
    if(v > best[1]) best=[d.label, v];
    if(v < worst[1]) worst=[d.label, v];
  });
  const highRate = (STATE.rows.filter(r=>r.avg!=null && r.avg>=4).length / total * 100);
  const lowRate = (STATE.rows.filter(r=>r.avg!=null && r.avg<3.5).length / total * 100);
  document.getElementById("kpi").innerHTML = `
    <div class="cell"><div class="k">總反饋筆數</div><div class="v">${total}</div></div>
    <div class="cell"><div class="k">老師人數</div><div class="v">${tcount}</div></div>

  `;
}

// ---------- TEACHER ANALYSIS (pure math) ----------
function analyzeTeacher(t){
  const dimDelta = {};
  DIMS.forEach(d=>{
    const v = t.dimAvg[d.key];
    dimDelta[d.key] = v==null? null : v - STATE.teamDimAvg[d.key];
  });
  const validDimAvgs = DIMS.map(d=>t.dimAvg[d.key]).filter(x=>x!=null);
  const ownDimAvg = validDimAvgs.length? mean(validDimAvgs): 0;
  const dimOwnDelta = {};
  DIMS.forEach(d=>{
    const v = t.dimAvg[d.key];
    dimOwnDelta[d.key] = v==null? null : v - ownDimAvg;
  });
  const dimRates = {};
  DIMS.forEach(d=>{
    const arr = t.dims[d.key];
    dimRates[d.key] = {
      high: arr.length? (arr.filter(x=>x>=4).length / arr.length) : 0,
      low: arr.length? (arr.filter(x=>x<=2).length / arr.length) : 0,
      count: arr.length
    };
  });

  const strengths = DIMS.map(d=>({d, own:dimOwnDelta[d.key], team:dimDelta[d.key], rate:dimRates[d.key].high, val:t.dimAvg[d.key]}))
    .filter(x=>x.val!=null).sort((a,b)=>b.own-a.own);
  const weaknesses = [...strengths].reverse();

  const teamDelta = DIMS.map(d=>({d, delta:dimDelta[d.key], val:t.dimAvg[d.key], std:t.dimStd[d.key]})).filter(x=>x.val!=null);
  const mostAbove = teamDelta.length? [...teamDelta].sort((a,b)=>b.delta-a.delta)[0] : null;
  const mostBelow = teamDelta.length? [...teamDelta].sort((a,b)=>a.delta-b.delta)[0] : null;
  const totalStd = DIMS.map(d=>t.dimStd[d.key]).length? mean(DIMS.map(d=>t.dimStd[d.key])) : 0;

  const sorted = [...t.rows].sort((a,b)=>new Date(a.date.replace(/\//g,"-"))-new Date(b.date.replace(/\//g,"-")));
  const avgSeries = sorted.map(r=>r.avg).filter(x=>x!=null);
  const trendSlope = slope(avgSeries);
  const dimSlopes = {};
  DIMS.forEach(d=>{
    const s = sorted.map(r=>r[d.key]).filter(x=>x!=null);
    dimSlopes[d.key] = s.length>=2? slope(s) : 0;
  });

  const dimDist = {};
  DIMS.forEach(d=>{
    const counts = [0,0,0,0,0];
    t.dims[d.key].forEach(v=>{ if(v>=1 && v<=5) counts[Math.round(v)-1]++; });
    dimDist[d.key] = counts;
  });

  return { dimDelta, dimOwnDelta, dimRates, dimSlopes, dimDist,
    strengths, weaknesses, teamDelta, mostAbove, mostBelow, totalStd,
    trendSlope, avgSeries, sorted, ownDimAvg };
}

function teamRank(t){
  const valid = STATE.teachers.filter(x=>x.avg!=null && x.count>=2).sort((a,b)=>b.avg-a.avg);
  const idx = valid.findIndex(x=>x.name===t.name);
  if(idx<0) return `— / ${valid.length}（筆數不足）`;
  return `#${idx+1} / ${valid.length}`;
}

function renderStrengths(A, t){
  if(t.count < 2) return `<div class="empty">此老師僅 ${t.count} 筆 Demo，樣本不足以歸納共同優點。</div>`;
  const candidates = A.strengths.filter(x=>x.own>=0.1 || x.rate>=0.7).slice(0,3);
  if(!candidates.length) return `<div class="empty">此老師各維度表現平均，無明顯突出強項。</div>`;
  return candidates.map(x=>{
    const relMsg = x.own>=0.3 ? "明顯高於自身平均" : x.own>=0.1 ? "略高於自身平均" : "相對穩定";
    const teamMsg = x.team>=0.2 ? `，且比團隊平均高 ${x.team.toFixed(2)} 分` : x.team>=0 ? "，與團隊水準相當" : `，惟仍低於團隊 ${Math.abs(x.team).toFixed(2)} 分`;
    const rateStr = (x.rate*100).toFixed(0);
    return `<div class="stat-item pos">
      <div class="label">
        <span class="dim-tag">${x.d.key}</span>
        <span class="dim-name">${x.d.label}</span>
        <span class="metric">均分 <b>${x.val.toFixed(2)}</b> · 高分率 <b>${rateStr}%</b></span>
      </div>
      <div class="desc">${relMsg}${teamMsg}。${A.dimRates[x.d.key].count} 筆中 <b>${Math.round(x.rate*A.dimRates[x.d.key].count)}</b> 筆得 4 分以上。</div>
    </div>`;
  }).join("");
}

function renderWeaknesses(A, t){
  if(t.count < 2) return `<div class="empty">此老師僅 ${t.count} 筆 Demo，樣本不足以歸納共同缺點。</div>`;
  const candidates = A.weaknesses.filter(x=>x.own<=-0.1 || A.dimRates[x.d.key].low>=0.2).slice(0,3);
  if(!candidates.length) return `<div class="empty">此老師各維度表現均衡，無明顯共同缺點。</div>`;
  return candidates.map(x=>{
    const relMsg = x.own<=-0.3 ? "明顯低於自身平均" : x.own<=-0.1 ? "略低於自身平均" : "相對持平";
    const teamMsg = x.team<=-0.2 ? `，且比團隊平均低 ${Math.abs(x.team).toFixed(2)} 分` : x.team<=0 ? "，與團隊水準相當" : `，雖然仍高於團隊 ${x.team.toFixed(2)} 分`;
    const lowRate = A.dimRates[x.d.key].low;
    const lowMsg = lowRate>=0.2 ? ` · 有 <b>${(lowRate*100).toFixed(0)}%</b> 的 Demo 拿到 2 分以下` : "";
    return `<div class="stat-item neg">
      <div class="label">
        <span class="dim-tag">${x.d.key}</span>
        <span class="dim-name">${x.d.label}</span>
        <span class="metric">均分 <b>${x.val.toFixed(2)}</b> · 高分率 <b>${(x.rate*100).toFixed(0)}%</b></span>
      </div>
      <div class="desc">${relMsg}${teamMsg}${lowMsg}。</div>
    </div>`;
  }).join("");
}

function renderFeatures(A, t){
  if(t.count < 2) return `<div class="empty">此老師僅 ${t.count} 筆 Demo，樣本不足以歸納特色。</div>`;
  const parts = [];

  if(A.mostAbove && A.mostAbove.delta >= 0.2){
    parts.push(`<div class="stat-item">
      <div class="label"><span class="dim-tag" style="border-color:var(--good);color:var(--good)">標誌強項</span><span class="dim-name">${A.mostAbove.d.label}</span><span class="metric">+${A.mostAbove.delta.toFixed(2)} vs 團隊</span></div>
      <div class="desc">此老師最突出的維度，比團隊平均高 ${A.mostAbove.delta.toFixed(2)} 分</div>
    </div>`);
  }
  if(A.mostBelow && A.mostBelow.delta <= -0.2){
    parts.push(`<div class="stat-item">
      <div class="label"><span class="dim-tag" style="border-color:var(--bad);color:var(--bad)">明顯短板</span><span class="dim-name">${A.mostBelow.d.label}</span><span class="metric">${A.mostBelow.delta.toFixed(2)} vs 團隊</span></div>
      <div class="desc">此老師最明顯的短板，比團隊平均低 ${Math.abs(A.mostBelow.delta).toFixed(2)} 分</div>
    </div>`);
  }
  const stdLabel = A.totalStd < 0.4 ? "極穩定" : A.totalStd < 0.7 ? "穩定" : A.totalStd < 1.0 ? "中等波動" : "高度波動";
  const stdColor = A.totalStd < 0.4 ? "var(--good)" : A.totalStd < 0.7 ? "var(--accent)" : "var(--bad)";
  parts.push(`<div class="stat-item">
    <div class="label"><span class="dim-tag" style="border-color:${stdColor};color:${stdColor}">表現穩定度</span><span class="dim-name">${stdLabel}</span><span class="metric">平均 σ = <b>${A.totalStd.toFixed(2)}</b></span></div>
    <div class="desc">${A.totalStd < 0.4 ? "每次 Demo 表現一致，品質可預期" : A.totalStd < 0.7 ? "表現大致一致，偶有起伏" : A.totalStd < 1.0 ? "表現起伏明顯，需留意學員匹配" : "表現極不穩定，不同場合落差大"}</div>
  </div>`);

  if(A.mostAbove && A.mostBelow){
    const gap = A.mostAbove.val - A.mostBelow.val;
    if(gap >= 1.5){
      parts.push(`<div class="stat-item">
        <div class="label"><span class="dim-tag" style="border-color:var(--purple);color:var(--purple)">偏科型</span><span class="dim-name">${A.mostAbove.d.label} ↔ ${A.mostBelow.d.label}</span><span class="metric">落差 ${gap.toFixed(2)}</span></div>
        <div class="desc">強弱項差距大，在${A.mostAbove.d.label}突出但${A.mostBelow.d.label}需加強</div>
      </div>`);
    } else if(gap < 0.5){
      parts.push(`<div class="stat-item">
        <div class="label"><span class="dim-tag" style="border-color:var(--info);color:var(--info)">全面均衡</span><span class="dim-name">五維度差距小</span><span class="metric">落差 ${gap.toFixed(2)}</span></div>
        <div class="desc">五個維度表現平均，無明顯偏科</div>
      </div>`);
    }
  }
  return parts.length? parts.join("") : `<div class="empty">此老師表現與團隊接近，無突出特色。</div>`;
}

function renderTrendInsight(A){
  if(A.avgSeries.length < 3) return `<b>樣本數不足：</b>僅 ${A.avgSeries.length} 筆 Demo，無法判斷趨勢。`;
  const s = A.trendSlope;
  const firstHalf = A.avgSeries.slice(0, Math.floor(A.avgSeries.length/2));
  const secondHalf = A.avgSeries.slice(Math.ceil(A.avgSeries.length/2));
  const delta = mean(secondHalf) - mean(firstHalf);
  let trendLabel, trendClass;
  if(s >= 0.05){ trendLabel="明顯進步"; trendClass="trend-up"; }
  else if(s >= 0.01){ trendLabel="緩步進步"; trendClass="trend-up"; }
  else if(s <= -0.05){ trendLabel="明顯退步"; trendClass="trend-down"; }
  else if(s <= -0.01){ trendLabel="緩步退步"; trendClass="trend-down"; }
  else { trendLabel="表現穩定"; trendClass="trend-flat"; }
  const recent3 = A.avgSeries.slice(-3);
  const recentAvg = mean(recent3);
  const overallAvg = mean(A.avgSeries);
  const recentDelta = recentAvg - overallAvg;
  const dimSlopeEntries = DIMS.map(d=>({d, s:A.dimSlopes[d.key]})).sort((a,b)=>b.s-a.s);
  const bestImprove = dimSlopeEntries[0];
  const worstDecline = dimSlopeEntries[dimSlopeEntries.length-1];
  let dimTrend = "";
  if(bestImprove.s >= 0.05) dimTrend += `<br>📈 <b>${bestImprove.d.label}</b> 進步最明顯（斜率 +${bestImprove.s.toFixed(3)}）。`;
  if(worstDecline.s <= -0.05) dimTrend += `<br>📉 <b>${worstDecline.d.label}</b> 退步最明顯（斜率 ${worstDecline.s.toFixed(3)}）。`;
  return `
    <b>整體趨勢：</b><span class="${trendClass}">${trendLabel}</span>（斜率 ${s>=0?'+':''}${s.toFixed(3)}，後半均分 ${delta>=0?'+':''}${delta.toFixed(2)} vs 前半）
    <br><b>近 3 筆平均：</b>${recentAvg.toFixed(2)}（${recentDelta>=0?'+':''}${recentDelta.toFixed(2)} vs 整體平均 ${overallAvg.toFixed(2)}）
    ${dimTrend}
  `;
}

function renderDimDistribution(A){
  return DIMS.map(d=>{
    const dist = A.dimDist[d.key];
    const total = dist.reduce((a,b)=>a+b,0);
    if(!total) return `<div class="empty" style="margin-bottom:12px">${d.label}：無資料</div>`;
    return `<div style="margin-bottom:14px">
      <div style="font-size:12px;color:var(--text-dim);margin-bottom:4px;font-family:'JetBrains Mono',monospace;letter-spacing:.5px">${d.label} (${d.key}) · n=${total}</div>
      <div class="dist-wrap">
        ${[5,4,3,2,1].map(sc=>{
          const n = dist[sc-1];
          const pct = total? (n/total*100):0;
          return `<div class="dist-row s${sc}">
            <div class="dist-label">${sc} 分</div>
            <div class="dist-bar" style="--p:${pct}%"></div>
            <div class="dist-val">${n} · ${pct.toFixed(0)}%</div>
          </div>`;
        }).join("")}
      </div>
    </div>`;
  }).join("");
}

function renderSlopes(A){
  const entries = DIMS.map(d=>({d, s:A.dimSlopes[d.key]}));
  const maxAbs = Math.max(...entries.map(x=>Math.abs(x.s)), 0.001);
  return `<div class="dim-grid" style="margin-top:8px">
    ${entries.map(x=>{
      const absPct = (Math.abs(x.s)/maxAbs*50);
      const isPos = x.s >= 0;
      const color = x.s >= 0.05 ? "var(--good)" : x.s <= -0.05 ? "var(--bad)" : "var(--text-dim)";
      const label = x.s >= 0.05 ? "進步" : x.s <= -0.05 ? "退步" : "持平";
      return `<div class="dim-row" style="grid-template-columns:72px 1fr 90px">
        <div class="dname">${x.d.label}<br><span style="color:var(--text-faint)">${x.d.key}</span></div>
        <div style="position:relative;height:14px;background:var(--bg-2);border:1px solid var(--line)">
          <div style="position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--line-2)"></div>
          <div style="position:absolute;top:0;bottom:0;${isPos?`left:50%;width:${absPct}%`:`right:50%;width:${absPct}%`};background:${color}"></div>
        </div>
        <div style="font-family:'JetBrains Mono',monospace;font-size:11px;text-align:right;color:${color}">
          <b>${x.s>=0?'+':''}${x.s.toFixed(3)}</b><br><span style="color:var(--text-faint);font-size:10px">${label}</span>
        </div>
      </div>`;
    }).join("")}
  </div>
  <div class="legend-mini">
    <span>斜率 ＞ +0.05 視為進步 · ＜ -0.05 視為退步</span>
  </div>`;
}

function fbHtml(r, cls){
  return `<div class="fb-item ${cls}">
    <div class="fb-meta"><b>${r.date}</b> · 學員 ${escapeHtml(r.student||"—")} · 顧問 ${escapeHtml(r.consultant||"—")} · 均分 ${r.avg?r.avg.toFixed(1):'—'}</div>
    <div class="fb-text">${escapeHtml(r.consultantNote)}</div>
    ${r.adminNote?`<div class="fb-text" style="color:var(--info);margin-top:4px;font-size:12px">教務：${escapeHtml(r.adminNote)}</div>`:""}
  </div>`;
}

function rowHtml(r){
  const scoreTxt = DIMS.map(d=>`${d.key}:${r[d.key]??"—"}`).join(" ");
  return `<div class="fb-item ${r.avg&&r.avg<3.5?'neg':r.avg&&r.avg>=4?'pos':''}">
    <div class="fb-meta"><b>${r.date}</b> · 學員 ${escapeHtml(r.student||"—")} · 顧問 ${escapeHtml(r.consultant||"—")} · 均分 <b style="color:${scoreColor(r.avg)}">${r.avg?r.avg.toFixed(1):'—'}</b></div>
    <div class="fb-meta" style="font-family:'JetBrains Mono',monospace">${scoreTxt}</div>
    ${r.consultantNote?`<div class="fb-text" style="margin-top:4px">${escapeHtml(r.consultantNote)}</div>`:""}
    ${r.adminNote?`<div class="fb-text" style="color:var(--info);margin-top:4px;font-size:12px">教務：${escapeHtml(r.adminNote)}</div>`:""}
  </div>`;
}

function drawTeacherRadar(t){
  const c = new Chart(document.getElementById("radarT"),{
    type:"radar",
    data:{
      labels: DIMS.map(d=>`${d.label} (${d.key})`),
      datasets:[
        {label:t.name, data:DIMS.map(d=>t.dimAvg[d.key]||0), backgroundColor:"rgba(255,209,102,.18)",borderColor:"#ffd166",pointBackgroundColor:"#ffd166",borderWidth:2,pointRadius:4},
        {label:"團隊平均", data:DIMS.map(d=>STATE.teamDimAvg[d.key]), backgroundColor:"rgba(76,201,240,.08)",borderColor:"#4cc9f0",pointBackgroundColor:"#4cc9f0",borderWidth:1.5,pointRadius:3,borderDash:[4,4]}
      ]
    },
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#e8ecf1"}}},
      scales:{r:{min:0,max:5,ticks:{color:"#5b6472",backdropColor:"transparent",stepSize:1},grid:{color:"#323b47"},angleLines:{color:"#323b47"},pointLabels:{color:"#e8ecf1",font:{size:11}}}}}
  });
  STATE.charts.push(c);
}

function drawTeacherTrend(t, A){
  const sorted = A.sorted;
  const labels = sorted.map(r=>`${r.date.slice(5)}·${(r.student||'').slice(0,6)}`);
  const avgs = sorted.map(r=>r.avg);
  const ma = avgs.map((_,i)=>{
    const w = avgs.slice(Math.max(0,i-2),i+1).filter(x=>x!=null);
    return w.length? mean(w): null;
  });
  const c = new Chart(document.getElementById("trendT"),{
    type:"line",
    data:{labels,datasets:[
      ...DIMS.map(d=>({label:d.label,data:sorted.map(r=>r[d.key]),borderColor:d.color,backgroundColor:"transparent",borderWidth:1.2,pointRadius:2,tension:.25})),
      {label:"均分",data:avgs,borderColor:"#e8ecf1",backgroundColor:"transparent",borderWidth:1.8,pointRadius:3,tension:.2},
      {label:"均分·3點移動平均",data:ma,borderColor:"#ffd166",backgroundColor:"rgba(255,209,102,.08)",borderWidth:2.5,pointRadius:0,tension:.3,fill:true,borderDash:[6,3]}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:"#e8ecf1",font:{size:11},boxWidth:14}}},
      scales:{
        x:{grid:{color:"#262d36"},ticks:{color:"#9aa4b2",maxRotation:60,minRotation:45,font:{size:9}}},
        y:{min:0,max:5,grid:{color:"#262d36"},ticks:{color:"#9aa4b2",stepSize:1}}
      }}
  });
  STATE.charts.push(c);
}

function escapeHtml(s){return String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function escapeAttr(s){return escapeHtml(s)}

document.getElementById("reloadBtn").addEventListener("click",fetchData);
fetchData();
</script>
